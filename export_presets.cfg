; APEX Motorsport Manager — exportação PC Godot 4.7.2
; Presets sem credenciais ou certificados; use --export-release.
; Arquivos .json carregados por FileAccess precisam entrar no pacote.
; Artefatos de testes, documentação e ferramentas não fazem parte da distribuição.

[preset.0]

name="APEX Linux x86_64"
platform="Linux"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/*.txt"
exclude_filter="qa/*,tests/*,docs/*,tools/*,.github/*,addons/gdUnit4/*,experimental/*,APEX_06499_STRATEGY_SIMULATOR/*,linux/*"
export_path="builds/linux/APEX_Motorsport_Manager.x86_64"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_encryption_key=""

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=false
binary_format/architecture="x86_64"
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false

[preset.1]

name="APEX Windows x86_64"
platform="Windows Desktop"
runnable=false
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="data/*.json,data/*.txt"
exclude_filter="qa/*,tests/*,docs/*,tools/*,.github/*,addons/gdUnit4/*,experimental/*,APEX_06499_STRATEGY_SIMULATOR/*,linux/*"
export_path="builds/windows/APEX_Motorsport_Manager.exe"
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_encryption_key=""

[preset.1.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
