name: APEX - Driver Traffic 9.20 validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/core/race_driver_traffic_0920.gd'
      - 'scripts/core/race_space_0655.gd'
      - 'scripts/race_engine.gd'
      - 'scripts/core/race_replay_0660.gd'
      - 'tests/driver_traffic_0920_test.gd'
      - 'tests/aero_wake_091711_test.gd'
      - '.github/workflows/apex-driver-traffic-0920.yml'
permissions:
  contents: read
jobs:
  driver_traffic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [ITA, GBR, MON]
        climate: [Seco, Chuva intensa]
        seed: [42, 123]
    env:
      APEX_DRIVER_TRAFFIC: '1'
      APEX_AERO_TRACK: ${{ matrix.track }}
      APEX_AERO_CLIMATE: ${{ matrix.climate }}
      APEX_AERO_TICKS: '1800'
      APEX_AERO_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh driver_traffic_0920_test.gd 2>&1 | tee fixture.log
          grep -Fq DRIVER_TRAFFIC_0920_PASS fixture.log
          bash tools/apex_ci_isolated_test.sh aero_wake_091711_test.gd 2>&1 | tee driver_traffic.log
          grep -Fq AERO_WAKE_091711_PASS driver_traffic.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' fixture.log driver_traffic.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-driver-traffic-${{ matrix.track }}-${{ matrix.climate }}-${{ matrix.seed }}
          path: |
            import.log
            fixture.log
            driver_traffic.log
          retention-days: 14
