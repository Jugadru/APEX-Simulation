name: APEX - Tactical coordination validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    paths:
      - '.github/workflows/apex-corner-battle.yml'
      - '.github/workflows/apex-driver-error-0921.yml'
      - '.github/workflows/apex-driver-traffic-0920.yml'
      - '.github/workflows/apex-tactical-coordination.yml'
      - '.github/workflows/apex-traffic-mega-09201.yml'
      - 'data/season_2012.json'
      - 'project.godot'
      - 'scripts/core/race_aero_wake_091711.gd'
      - 'scripts/core/race_corner_battle_0919.gd'
      - 'scripts/core/race_driver_error_0921.gd'
      - 'scripts/core/race_driver_traffic_0920.gd'
      - 'scripts/core/race_independent_racecraft_091710.gd'
      - 'scripts/core/race_kers_2012.gd'
      - 'scripts/core/race_merge_traffic_0669174.gd'
      - 'scripts/core/race_performance.gd'
      - 'scripts/core/race_pit_lane.gd'
      - 'scripts/core/race_racing_line_091710.gd'
      - 'scripts/core/race_replay_0660.gd'
      - 'scripts/core/race_space_0655.gd'
      - 'scripts/core/race_state_codec_0660.gd'
      - 'scripts/core/race_tactical_coordination_091712.gd'
      - 'scripts/core/race_traffic_pack_09201.gd'
      - 'scripts/core/race_traffic_strategy_09201.gd'
      - 'scripts/core/race_tyre_thermal.gd'
      - 'scripts/core/race_weather_setup_15.gd'
      - 'scripts/race_engine.gd'
      - 'tests/aero_wake_091711_test.gd'
      - 'tests/corner_battle_0919_test.gd'
      - 'tests/driver_error_0921_test.gd'
      - 'tests/driver_traffic_0920_test.gd'
      - 'tests/tactical_coordination_091712_test.gd'
      - 'tests/traffic_mega_09201_test.gd'
      - 'tools/apex_ci_grouped_pilot.py'
      - 'tools/apex_ci_import.sh'
      - 'tools/apex_ci_isolated_test.sh'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Grouped production or independent diagnosis'
        type: choice
        default: grouped
        options: [grouped, grouped-pilot, legacy-coordination]
permissions:
  contents: read
jobs:
  coordination:
    # Eleven common scenarios grouped; historical anchor runs coordination only.
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'grouped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [ITA, GBR, MON]
        climate: [Seco, Chuva intensa]
        seed: [42, 123]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: python3 tools/apex_ci_grouped_pilot.py --self-test
      - name: Hybrid sporting production
        env:
          PILOT_TRACK: ${{ matrix.track }}
          PILOT_CLIMATE: ${{ matrix.climate }}
          PILOT_SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          if [[ "$PILOT_TRACK" == ITA && "$PILOT_CLIMATE" == Seco && "$PILOT_SEED" == 42 ]]; then
            python3 tools/apex_ci_grouped_pilot.py --track ITA --climate Seco --seed 42 --anchor-mode coordination --output grouped-evidence
          else
            python3 tools/apex_ci_grouped_pilot.py --track "$PILOT_TRACK" --climate "$PILOT_CLIMATE" --seed "$PILOT_SEED" --grouped-only --output grouped-evidence
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-grouped-production-${{ matrix.track }}-${{ matrix.climate }}-${{ matrix.seed }}
          path: |
            import.log
            grouped-evidence/
          retention-days: 14

  historical-anchor:
    if: (github.event_name == 'pull_request' && github.event.action != 'labeled') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'grouped')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        mode: [corner, traffic, mega, error]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: python3 tools/apex_ci_grouped_pilot.py --self-test
      - name: Independent historical comparison and fixture
        env:
          ANCHOR_MODE: ${{ matrix.mode }}
        run: |
          set -euo pipefail
          python3 tools/apex_ci_grouped_pilot.py --track ITA --climate Seco --seed 42 --anchor-mode "$ANCHOR_MODE" --output grouped-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-grouped-production-anchor-${{ matrix.mode }}
          path: |
            import.log
            grouped-evidence/
          retention-days: 14

  hybrid-evidence:
    needs: [coordination, historical-anchor]
    if: ${{ always() && ((github.event_name == 'pull_request' && github.event.action != 'labeled') || (github.event_name == 'workflow_dispatch' && inputs.mode == 'grouped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all native jobs
        env:
          GROUP_RESULT: ${{ needs.coordination.result }}
          ANCHOR_RESULT: ${{ needs.historical-anchor.result }}
        run: |
          set -euo pipefail
          test "$GROUP_RESULT" = success
          test "$ANCHOR_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: apex-grouped-production-*
          path: matrix-evidence
          merge-multiple: false
      - run: python3 tools/apex_ci_grouped_pilot.py --verify-production matrix-evidence

  legacy-coordination:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'legacy-coordination'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [ITA, GBR, MON]
        climate: [Seco, Chuva intensa]
        seed: [42, 123]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      # This deterministic fixture does not read the matrix environment.
      # Run once per workflow; all 12 sporting scenarios still run below.
      - name: Fixed invariant fixture (once per matrix)
        if: matrix.track == 'ITA' && matrix.climate == 'Seco' && matrix.seed == 42
        run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh tactical_coordination_091712_test.gd 2>&1 | tee fixture.log
          grep -Fq COORDINATION_091712_PASS fixture.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' fixture.log
      - name: Sporting scenario (each matrix combination)
        env:
          APEX_COORDINATION: '1'
          APEX_AERO_TRACK: ${{ matrix.track }}
          APEX_AERO_CLIMATE: ${{ matrix.climate }}
          APEX_AERO_TICKS: '1800'
          APEX_AERO_SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh aero_wake_091711_test.gd 2>&1 | tee coordination.log
          grep -Fq AERO_WAKE_091711_PASS coordination.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' coordination.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-coordination-${{ matrix.track }}-${{ matrix.climate }}-${{ matrix.seed }}
          path: |
            import.log
            fixture.log
            coordination.log
          retention-days: 14

  grouped-pilot:
    # Independent equivalence diagnosis is explicit, never part of ordinary PRs.
    if: (github.event_name == 'workflow_dispatch' && inputs.mode == 'grouped-pilot') || (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ci:grouped-pilot')
    runs-on: ubuntu-latest
    # Anchor worst-case: five independent 240s baselines + grouped 1200s
    # + clean import/setup/artifact handling. Other cases retain 30 minutes.
    timeout-minutes: ${{ matrix.track == 'ITA' && matrix.climate == 'Seco' && matrix.seed == 42 && 50 || 30 }}
    strategy:
      fail-fast: false
      matrix:
        track: [ITA, GBR, MON]
        climate: [Seco, Chuva intensa]
        seed: [42, 123]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: python3 tools/apex_ci_grouped_pilot.py --self-test
      - name: Compare five isolated baselines with grouped pilot
        env:
          PILOT_TRACK: ${{ matrix.track }}
          PILOT_CLIMATE: ${{ matrix.climate }}
          PILOT_SEED: ${{ matrix.seed }}
        run: |
          set -euo pipefail
          python3 tools/apex_ci_grouped_pilot.py --track "$PILOT_TRACK" --climate "$PILOT_CLIMATE" --seed "$PILOT_SEED" --output pilot-evidence
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-grouped-pilot-${{ matrix.track }}-${{ matrix.climate }}-${{ matrix.seed }}
          path: |
            import.log
            pilot-evidence/
          retention-days: 14
