
name: APEX - Teste Grafico

on:
  workflow_dispatch:
jobs:
  teste-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Baixar APEX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar Godot
        uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false

      - name: Preparar ambiente grafico
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri

      - name: Importar projeto
        run: godot --headless --path . --import

      - name: Iniciar APEX com tela virtual
        run: |
          xvfb-run -a godot --path . --audio-driver Dummy --rendering-method gl_compatibility --quit-after 120
