name: APEX - Pit Wall Intelligence Analyzer 1.0

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'project.godot'
      - 'scripts/**'
      - 'data/**'
      - 'tests/ci/apex_pitwall_intelligence_probe.gd'
      - 'tools/apex_pitwall_intelligence.py'
      - 'tools/tests/test_apex_pitwall_intelligence.py'
      - '.github/workflows/apex-pitwall-intelligence-ci.yml'

permissions:
  contents: read

concurrency:
  group: apex-pitwall-analyzer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pitwall-intelligence:
    name: Analisar escolhas do Pit Wall / 2012, sem modificar IA
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout do APEX
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Preparar Godot 4.7.2
        timeout-minutes: 15
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable

      - name: Testar classificador e integridade dos registros Python
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests \
            -p 'test_apex_pitwall_intelligence.py' -v

      - name: Importar o projeto real no Godot
        run: |
          set -euo pipefail
          godot --headless --path . --import > pitwall-import.log 2>&1
          if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' pitwall-import.log; then
            cat pitwall-import.log
            exit 1
          fi

      - name: Coletar decisoes e executar duas repeticoes por cenario
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/ci_artifacts/pitwall_intelligence"
          mkdir -p "$output"
          run_case() {
            local name="$1"
            local rep="$2"
            local label="${name}_${rep}"
            (
              export HOME="$RUNNER_TEMP/apex-pitwall-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${label}"
              export XDG_DATA_HOME="$HOME/data"
              export XDG_CONFIG_HOME="$HOME/config"
              export XDG_CACHE_HOME="$HOME/cache"
              mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
              export APEX_PITWALL_SCENARIO="$name"
              timeout 180s godot --headless --path . \
                --script res://tests/ci/apex_pitwall_intelligence_probe.gd \
                > "$output/${label}.log" 2>&1
            )
          }
          for scenario in ita_dry_auto gbr_wet_auto bra_variable_auto ita_manual_v7; do
            for rep in 1 2; do
              echo "APEX_PITWALL_ANALYZER_START ${scenario}_${rep}"
              run_case "$scenario" "$rep"
            done
          done
          python3 tools/apex_pitwall_intelligence.py --project . --output "$output"

      - name: Publicar analise com ressalvas
        if: always()
        shell: bash
        run: |
          if test -f ci_artifacts/pitwall_intelligence/report.md; then
            cat ci_artifacts/pitwall_intelligence/report.md >> "$GITHUB_STEP_SUMMARY"
          elif test -f ci_artifacts/pitwall_intelligence/error.txt; then
            echo '### Pit Wall Intelligence Analyzer — FAIL / INCONCLUSIVE' >> "$GITHUB_STEP_SUMMARY"
            cat ci_artifacts/pitwall_intelligence/error.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo '### Pit Wall Intelligence Analyzer — INCONCLUSIVE: missing report' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Arquivar logs de Godot, evidencias e relatorios
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-pitwall-intelligence-report
          path: |
            ci_artifacts/pitwall_intelligence/
            pitwall-import.log
          retention-days: 14
          if-no-files-found: warn
