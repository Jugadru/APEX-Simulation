name: APEX - Wet Strategy Intelligence (v9.8)
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/wet_strategy_06698_test.gd'
      - 'project.godot'
      - '.github/workflows/apex-wet-strategy-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wet-strategy:
    name: Godot 4.7.2 / imperfect forecast / V21 / replay 019-020
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Importar projeto
        run: godot --headless --single-threaded-scene --path . --import
      - name: Testes direcionados e regressões
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/wet_strategy
          run_test() {
            local script="$1"
            local marker="$2"
            timeout 240s godot --headless --single-threaded-scene --path . \
              --script "res://tests/$script" \
              > "ci_artifacts/wet_strategy/$script.log" 2>&1 || {
              cat "ci_artifacts/wet_strategy/$script.log"
              exit 1
            }
            cat "ci_artifacts/wet_strategy/$script.log"
            grep -Fq "$marker" "ci_artifacts/wet_strategy/$script.log"
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|_FAIL)' "ci_artifacts/wet_strategy/$script.log"; then
              exit 1
            fi
          }
          run_test wet_strategy_06698_test.gd WET_STRATEGY_06698_PASS
          run_test core_0641_weather_strategy_test.gd "APEX 0641 WEATHER / AI PASS"
          run_test pit_coordination_06697_test.gd PIT_COORD_06697_PASS
          run_test pit_queue_prevention_066971_test.gd PIT_QUEUE_066971_PASS
          run_test pitwall_prediction_06696_test.gd PITWALL_LEDGER_06696_PASS
      - name: Evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-wet-strategy-06698
          path: ci_artifacts/wet_strategy/
          retention-days: 14
          if-no-files-found: warn
