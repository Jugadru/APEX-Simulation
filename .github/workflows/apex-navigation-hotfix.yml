name: APEX - Navigation Hotfix validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/main.gd'
      - 'scripts/apex_front_menu.gd'
      - 'scripts/apex_menu_screen.gd'
      - 'scripts/apex_management_hub.gd'
      - 'scripts/apex_staff_screen_0648.gd'
      - 'scripts/apex_workshop_0656.gd'
      - 'scripts/presentation/apex_navigation_09176.gd'
      - 'tests/navigation_09176_test.gd'
      - '.github/workflows/apex-navigation-hotfix.yml'
permissions:
  contents: read
jobs:
  navigation-native:
    if: github.head_ref == 'fix/v0.6.6.9.17.6-navigation'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri
      - run: |
          set -euo pipefail
          mkdir -p qa/navigation_09176
          bash tools/apex_ci_import.sh qa/navigation_09176/import.log
          timeout 300s xvfb-run -a -s '-screen 0 1920x1080x24' godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --audio-driver Dummy --script res://tests/navigation_09176_test.gd 2>&1 | tee qa/navigation_09176/native.log
          grep -Fq NAVIGATION_09176_PASS qa/navigation_09176/native.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' qa/navigation_09176/native.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-navigation-native
          path: qa/navigation_09176/
          retention-days: 14
