name: APEX - Race Traffic Hotfix validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/core/race_merge_traffic_0669174.gd'
      - 'scripts/core/race_space_0655.gd'
      - 'scripts/core/race_replay_0660.gd'
      - 'scripts/race_engine.gd'
      - 'tests/race_traffic_hotfix_09177_test.gd'
      - 'scripts/apex_racecraft_0654.gd'
      - 'scripts/track_3d.gd'
      - 'tests/traffic_visual_ab_09177_test.gd'
      - 'tests/traffic_space_ab_09177_test.gd'
      - 'tests/traffic_arc_09177_test.gd'
      - 'tests/traffic_road_width_09177_test.gd'
      - 'tests/race_traffic_full_gp_09177_test.gd'
      - 'tests/legacy/*baseline_09177.gd'
      - '.github/workflows/apex-race-traffic-hotfix.yml'
permissions:
  contents: read
jobs:
  traffic:
    if: github.head_ref == 'fix/v0.6.6.9.17.7-race-traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 6617, 6558]
    env:
      APEX_TRAFFIC_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh race_traffic_hotfix_09177_test.gd 2>&1 | tee traffic.log
          grep -Fq TRAFFIC_09177_PASS traffic.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' traffic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-traffic-${{ matrix.seed }}
          path: |
            import.log
            traffic.log
          retention-days: 14
  motion:
    if: github.head_ref == 'fix/v0.6.6.9.17.7-race-traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh fixed_timeline_09173_test.gd 2>&1 | tee motion.log
          grep -Fq FIXED_TIMELINE_09173_PASS motion.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' motion.log
          bash tools/apex_ci_isolated_test.sh traffic_road_width_09177_test.gd 2>&1 | tee road-width.log
          grep -Fq TRAFFIC_ROAD_WIDTH_09177_PASS road-width.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' road-width.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-traffic-motion
          path: |
            import.log
            motion.log
            road-width.log
          retention-days: 14
  visual-ab:
    if: github.head_ref == 'fix/v0.6.6.9.17.7-race-traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        track: [MON, GBR, ITA, BEL]
    env:
      APEX_VISUAL_TRACK: ${{ matrix.track }}
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh traffic_visual_ab_09177_test.gd 2>&1 | tee visual-ab.log
          grep -Fq TRAFFIC_VISUAL_AB_09177_PASS visual-ab.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' visual-ab.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-visual-ab-${{ matrix.track }}
          path: |
            import.log
            visual-ab.log
          retention-days: 14
  space-ab:
    if: github.head_ref == 'fix/v0.6.6.9.17.7-race-traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh traffic_space_ab_09177_test.gd 2>&1 | tee space-ab.log
          grep -Fq TRAFFIC_SPACE_AB_09177_PASS space-ab.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' space-ab.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-space-ab
          path: |
            import.log
            space-ab.log
          retention-days: 14
  arc-high-speed:
    if: github.head_ref == 'fix/v0.6.6.9.17.7-race-traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 42
            climate: Seco
            track: MON
            pipeline: fixed
          - seed: 6558
            climate: Seco
            track: MON
            pipeline: fixed
          - seed: 6617
            climate: Chuva intensa
            track: MON
            pipeline: fixed
          - seed: 6558
            climate: Seco
            track: BEL
            pipeline: host
    env:
      APEX_VISUAL_TRACK: ${{ matrix.track }}
      APEX_ARC_PIPELINE: ${{ matrix.pipeline }}
      APEX_TRAFFIC_SEED: ${{ matrix.seed }}
      APEX_ARC_CLIMATE: ${{ matrix.climate }}
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh traffic_arc_09177_test.gd 2>&1 | tee arc.log
          grep -Fq TRAFFIC_ARC_09177_PASS arc.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' arc.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-arc-${{ matrix.track }}-${{ matrix.seed }}-${{ matrix.pipeline }}
          path: |
            import.log
            arc.log
          retention-days: 14
  full-gp:
    if: github.head_ref == 'fix/v0.6.6.9.17.7-race-traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        track: [GBR, ITA, MON]
    env:
      APEX_TRACK: ${{ matrix.track }}
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          sandbox="$(mktemp -d)"
          trap 'rm -rf -- "$sandbox"' EXIT
          export HOME="$sandbox/home" XDG_DATA_HOME="$sandbox/data" XDG_CONFIG_HOME="$sandbox/config" XDG_CACHE_HOME="$sandbox/cache" XDG_STATE_HOME="$sandbox/state"
          mkdir -p "$HOME" "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME" "$XDG_STATE_HOME"
          timeout 900s godot --headless --single-threaded-scene --path . --script res://tests/race_traffic_full_gp_09177_test.gd 2>&1 | tee gp.log
          grep -Fq TRAFFIC_FULL_GP_09177_PASS gp.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' gp.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-full-gp-${{ matrix.track }}
          path: |
            import.log
            gp.log
          retention-days: 14
