name: APEX Linux test export contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apex_lab_release.py'
      - 'tools/tests/test_apex_lab_release.py'
      - '.github/workflows/apex-lab-release.yml'
permissions:
  contents: read
jobs:
  test-export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
          include-templates: true
      - name: Build and verify exact candidate (no binary publication)
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/apex_lab_command.py execute --command build --base "$BASE" --head "$HEAD" --output "$RUNNER_TEMP/apex-test-export"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apex-test-export-evidence
          path: ${{ runner.temp }}/apex-test-export/
          retention-days: 7
