name: APEX - Competitive traffic multiseed
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/core/race_merge_traffic_0669174.gd'
      - 'scripts/core/race_space_0655.gd'
      - 'scripts/race_engine.gd'
      - 'scripts/core/race_replay_0660.gd'
      - 'tests/competitive_traffic_09174_test.gd'
      - '.github/workflows/apex-competitive-traffic.yml'
permissions:
  contents: read
jobs:
  preflight:
    if: github.head_ref == 'feat/v0.6.6.9.17.4-competitive-traffic'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
  multiseed:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 6617, 6558]
    env:
      APEX_TRAFFIC_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh competitive_traffic_09174_test.gd 2>&1 | tee traffic.log
          grep -Fq COMPETITIVE_TRAFFIC_09174_PASS traffic.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' traffic.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: competitive-traffic-${{ matrix.seed }}
          path: |
            import.log
            traffic.log
          retention-days: 14
