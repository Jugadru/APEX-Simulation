name: APEX - Pit Coordination 2.0 (v9.7)
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/pit_coordination_06697_test.gd'
      - 'tests/pit_queue_prevention_066971_test.gd'
      - 'tests/pitwall_prediction_06696_test.gd'
      - 'project.godot'
      - '.github/workflows/apex-pit-coordination-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  coordination:
    name: FIFO garage / safety hold / V21 / replay 017
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Importar projeto e scripts
        run: godot --headless --single-threaded-scene --path . --import
      - name: Testar fila determinística e regressões
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/pit_coordination
          run_test() {
            local script="$1"
            local marker="$2"
            timeout 240s godot --headless --single-threaded-scene --path . \
              --script "res://tests/$script" \
              > "ci_artifacts/pit_coordination/${script%.gd}.log" 2>&1 || {
              cat "ci_artifacts/pit_coordination/${script%.gd}.log"
              exit 1
            }
            cat "ci_artifacts/pit_coordination/${script%.gd}.log"
            grep -Fq "$marker" "ci_artifacts/pit_coordination/${script%.gd}.log"
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|_FAIL)' "ci_artifacts/pit_coordination/${script%.gd}.log"; then
              exit 1
            fi
          }
          run_test pit_coordination_06697_test.gd PIT_COORD_06697_PASS
          run_test pit_queue_prevention_066971_test.gd PIT_QUEUE_066971_PASS
          run_test team_pit_06497_unit_test.gd TEAM_06497_PASS
          run_test team_pit_06497_integration_test.gd INTEGRATION_06497_PASS
          run_test pit_incidents_double_stack_test.gd "APEX INCIDENT DOUBLE STACK OK"
          run_test pitwall_prediction_06696_test.gd PITWALL_LEDGER_06696_PASS
          run_test driver_soul_06694_test.gd DRIVER_SOUL_06694_PASS
          run_test pitwall_0649_strategy_test.gd PITWALL_0649_STRATEGY_PASS
      - name: Arquivar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-pit-coordination-06697
          path: ci_artifacts/pit_coordination/
          retention-days: 14
          if-no-files-found: warn
