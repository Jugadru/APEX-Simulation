name: APEX - Setup & Track Knowledge (v9.14)

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - 'scripts/core/race_setup_track_knowledge_066914.gd'
      - 'scripts/apex_race_hud_0622.gd'
      - 'tests/setup_track_066914_test.gd'
      - 'tests/engineer_intelligence_066913_test.gd'
      - '.github/workflows/apex-setup-track-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  setup-targeted:
    name: Godot 4.7.2 / 20 tracks / wet / V21 / HUD
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout APEX
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Setup Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Importar projeto real
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf .godot
            set +e
            timeout 240s godot --headless --single-threaded-scene --path . --import > import.log 2>&1
            status=$?
            set -e
            if grep -Eiq '(SCRIPT ERROR:|Parse Error:)' import.log; then
              cat import.log
              exit 1
            fi
            if [ "$status" -eq 0 ]; then
              if grep -Eiq '^ERROR:' import.log; then cat import.log; exit 1; fi
              echo "SETUP_TRACK_IMPORT_PASS attempt=$attempt"
              break
            fi
            if [ "$status" -ne 139 ] && [ "$status" -ne 134 ]; then
              cat import.log
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then cat import.log; exit "$status"; fi
            echo "Godot native import crashed ($status); retrying clean cache"
          done
      - name: Testar catálogo, UI, Replay e regressões
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/setup_track_066914
          run_test() {
            local script="$1" marker="$2"
            local log="ci_artifacts/setup_track_066914/${script}.log"
            timeout 360s godot --headless --single-threaded-scene --path . \
              --script "res://tests/${script}" > "${log}" 2>&1 || {
                cat "${log}"
                exit 1
              }
            cat "${log}"
            grep -Fq "${marker}" "${log}" || exit 1
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|SETUP_TRACK_066914_FAIL)' "${log}"; then
              exit 1
            fi
          }
          run_test setup_track_066914_test.gd SETUP_TRACK_066914_PASS
          run_test engineer_intelligence_066913_test.gd ENGINEER_066913_PASS
          run_test race_0646_engineer_3_test.gd RE3_0646_PASS
          run_test overtaking_066912_test.gd OVERTAKING_066912_PASS
          run_test replay_0660_test.gd REPLAY_UNIT_PASS
      - name: Evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-setup-track-066914
          path: |
            import.log
            ci_artifacts/setup_track_066914/
          retention-days: 14
          if-no-files-found: warn
