name: APEX - Exportacao Linux e Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  # Optional playtest export. Triggered ONLY by deliberately applying
  # build:preview to a PR; the normal FAST + Test Lab path is unchanged.
  pull_request:
    branches: [main]
    types: [labeled]

permissions:
  contents: read

jobs:
  export-pc:
    if: ${{ github.event_name != 'pull_request' || (github.event.action == 'labeled' && github.event.label.name == 'build:preview') }}
    name: Exportar desktop Godot 4.7.2
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Instalar Godot e export templates oficiais
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Conferir versao e presets
        run: |
          set -euo pipefail
          godot --version
          grep -q 'name="APEX Linux x86_64"' export_presets.cfg
          grep -q 'name="APEX Windows x86_64"' export_presets.cfg
          test -f data/season_2012.json

      - name: Testar empacotador
        run: |
          python3 -m unittest discover -s tools/tests \
            -p 'test_package_desktop_exports.py' -v

      - name: Importar os recursos com recuperacao de crash nativo
        shell: bash
        run: |
          set -euo pipefail
          # The 4.7.2 editor occasionally aborts on Linux runner threads.
          # Retry only exit 134/139; parser/scene/script errors are real failures.
          for attempt in 1 2 3; do
            rm -rf .godot
            set +e
            timeout 240s godot --headless --single-threaded-scene --path . --import > "ci_import_${attempt}.log" 2>&1
            code=$?
            set -e
            if grep -Eiq '(SCRIPT ERROR:|Parse Error:)' "ci_import_${attempt}.log"; then
              cat "ci_import_${attempt}.log"
              exit 1
            fi
            if [ "$code" -eq 0 ]; then
              if grep -Eiq '^ERROR:' "ci_import_${attempt}.log"; then
                cat "ci_import_${attempt}.log"
                exit 1
              fi
              echo "APEX_EXPORT_IMPORT_PASS attempt=$attempt"
              break
            fi
            if [ "$code" -ne 134 ] && [ "$code" -ne 139 ]; then
              cat "ci_import_${attempt}.log"
              exit "$code"
            fi
            if [ "$attempt" -eq 3 ]; then
              cat "ci_import_${attempt}.log"
              exit "$code"
            fi
            echo "Native Godot import crash $code; retrying with clean cache"
          done

      - name: Exportar jogo para Linux x86_64
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/linux builds/windows ci_artifacts
          godot --headless --path . \
            --export-release "APEX Linux x86_64" \
            builds/linux/APEX_Motorsport_Manager.x86_64 \
            2>&1 | tee ci_artifacts/export-linux.log
          test -s builds/linux/APEX_Motorsport_Manager.x86_64
          test -s builds/linux/APEX_Motorsport_Manager.pck

      - name: Exportar jogo para Windows x86_64
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . \
            --export-release "APEX Windows x86_64" \
            builds/windows/APEX_Motorsport_Manager.exe \
            2>&1 | tee ci_artifacts/export-windows.log
          test -s builds/windows/APEX_Motorsport_Manager.exe
          test -s builds/windows/APEX_Motorsport_Manager.pck

      - name: Validar a versao real dentro dos pacotes PCK
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          project = Path('project.godot').read_text(encoding='utf-8')
          match = re.search(r'^config/name="([^"]+)"', project, re.MULTILINE)
          assert match, 'Missing application/config/name in project.godot'
          expected = match.group(1).encode('utf-8')
          version = re.search(r'v\d+(?:\.\d+)+', match.group(1))
          assert version, 'Missing version number in application/config/name'
          description = re.search(r'^config/description="([^"]+)"', project, re.MULTILINE)
          assert description and version.group(0) in description.group(1), 'Version mismatch in project.godot'
          old = b"APEX Motorsport Manager v0.6.6.9.3"
          much_older = b"APEX Motorsport Manager v0.6.6.9.2"
          for platform in ("linux", "windows"):
              pck = Path("builds") / platform / "APEX_Motorsport_Manager.pck"
              data = pck.read_bytes()
              assert expected in data, f"{platform}: wrong application/config/name in PCK"
              assert old not in data, f"{platform}: old 9.3 application/config/name in PCK"
              assert much_older not in data, f"{platform}: old 9.2 application/config/name in PCK"
              print(f"APEX_BUILD_ID_06694_PASS {platform} {expected.decode()}")
          PY

      - name: Validar binarios e compactar
        run: |
          python3 tools/package_desktop_exports.py \
            --builds builds --output dist \
            --godot-version 4.7.2-stable

      - name: Verificar procedencia dos pacotes de teste
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq 'v0.6.6.9.15' project.godot
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          echo "APEX_PLAYTEST_RELEASE_SOURCE=$(cat dist/SOURCE_COMMIT.txt)"
      - name: Smoke de inicializacao Linux sem tela
        shell: bash
        run: |
          set -euo pipefail
          chmod +x builds/linux/APEX_Motorsport_Manager.x86_64
          timeout 90s builds/linux/APEX_Motorsport_Manager.x86_64 \
            --headless --quit-after 120 \
            2>&1 | tee ci_artifacts/linux-runtime-smoke.log
          echo 'APEX_EXPORT_LINUX_SMOKE_PASS'

      - name: Relatorio da exportacao
        if: always()
        shell: bash
        run: |
          {
            echo '### APEX - Exportacao automatica Linux e Windows'
            echo ''
            echo 'Preset Godot 4.7.2-stable, x86_64, modo release.'
            echo 'Artefatos ZIP incluem executavel e arquivo PCK (quando os testes passam).'
            echo ''
            echo 'Windows: build gerado, sem execucao no Windows, sem assinatura digital.'
            echo 'Linux: teste simples de inicializacao headless, nao substitui testes graficos no PC.'
            echo ''
            if [ -f dist/error.txt ]; then cat dist/error.txt; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar ZIPs e hashes
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: apex-pc-linux-windows-godot-4-7-2
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          retention-days: 14
          if-no-files-found: error
          compression-level: 0

      - name: Guardar logs para diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-pc-export-logs
          path: |
            ci_artifacts/*.log
            dist/error.txt
          retention-days: 14
          if-no-files-found: warn
