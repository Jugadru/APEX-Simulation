name: APEX - Race Motion diagnostics

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
    paths:
      - 'scripts/apex_racecraft_0654.gd'
      - 'scripts/track_3d.gd'
      - 'tests/visual_stutter_06672*'
      - '.github/workflows/apex-race-motion-diagnostic.yml'

permissions:
  contents: read

concurrency:
  group: apex-motion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  paired:
    if: github.head_ref == 'fix/v0.6.6.9.17.3-race-motion'
    name: Paired visual benchmark / seed ${{ matrix.seed }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        seed: [42, 6617, 6558]
    env:
      APEX_MOTION_SEED: ${{ matrix.seed }}
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: |
          set -euo pipefail
          mkdir -p motion-results
          bash tools/apex_ci_import.sh motion-results/import.log
          timeout 240s godot --headless --single-threaded-scene --path . --script res://tests/car_model_smoke_test.gd 2>&1 | tee motion-results/mesh.log
          grep -Fq 'APEX CAR MODEL TEST OK' motion-results/mesh.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' motion-results/mesh.log
          timeout 240s godot --headless --single-threaded-scene --path . --script res://tests/visual_stutter_06672_benchmark.gd 2>&1 | tee motion-results/benchmark.log
          grep -Fq 'VISUAL_STUTTER_06672_BENCHMARK' motion-results/benchmark.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' motion-results/benchmark.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-motion-seed-${{ matrix.seed }}
          path: motion-results/
          retention-days: 14
  capture:
    if: github.head_ref == 'fix/v0.6.6.9.17.3-race-motion'
    name: Monaco native graphics capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe
      APEX_MOTION_CAPTURE_TRACK: MON
      APEX_MOTION_SEED: 42
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri
      - run: |
          set -euo pipefail
          mkdir -p qa/visual_stutter_06672
          bash tools/apex_ci_import.sh qa/visual_stutter_06672/import.log
          timeout 300s xvfb-run -a -s '-screen 0 1920x1080x24' godot --path . --rendering-method gl_compatibility --rendering-driver opengl3 --script res://tests/visual_stutter_06672_capture.gd 2>&1 | tee qa/visual_stutter_06672/capture.log
          grep -Fq 'VISUAL_STUTTER_06672_VISUAL_PASS' qa/visual_stutter_06672/capture.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' qa/visual_stutter_06672/capture.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-motion-monaco-graphics
          path: qa/visual_stutter_06672/
          retention-days: 14
  legacy-replay-control:
    if: github.head_ref == 'fix/v0.6.6.9.17.3-race-motion'
    name: Historical replay / corrected candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        revision: [candidate]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.revision == 'base' && github.event.pull_request.base.sha || github.event.pull_request.head.sha }}
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: |
          set -euo pipefail
          mkdir -p replay-control
          git rev-parse HEAD | tee replay-control/commit.txt
          bash tools/apex_ci_import.sh replay-control/import.log
          timeout 240s godot --headless --single-threaded-scene --path . --script res://tests/driver_traffic_06693_test.gd 2>&1 | tee replay-control/replay.log
          grep -Fq 'DRIVER_TRAFFIC_06693_PASS' replay-control/replay.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' replay-control/replay.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-motion-replay-${{ matrix.revision }}
          path: replay-control/
          retention-days: 14
  live-grid-control:
    if: github.head_ref == 'fix/v0.6.6.9.17.3-race-motion'
    name: Live recording isolation and numbered grid
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        script: [race_live_without_replay_09173_test, grid_placement_09173_test, live_3d_replay_ab_09173_test]
    steps:
      - uses: actions/checkout@v4
      - uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c
        with:
          version: 4.7.2-stable
      - run: |
          set -euo pipefail
          mkdir -p live-grid
          bash tools/apex_ci_import.sh live-grid/import.log
          timeout 240s godot --headless --single-threaded-scene --path . --script res://tests/${{ matrix.script }}.gd 2>&1 | tee live-grid/test.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' live-grid/test.log
          grep -Eq 'LIVE_WITHOUT_REPLAY_09173_PASS|GRID_PLACEMENT_09173_PASS|LIVE_3D_REPLAY_AB_09173_PASS' live-grid/test.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apex-motion-${{ matrix.script }}
          path: live-grid/
          retention-days: 14
