name: APEX - Race Radio 3.0 (v9.5)
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/race_radio_06695_test.gd'
      - 'tests/driver_soul_06694_test.gd'
      - 'tests/core_0637_reactive_radio_smoke_test.gd'
      - 'tests/race_0647_soul2_test.gd'
      - 'project.godot'
      - '.github/workflows/apex-race-radio-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race-radio:
    name: Original written radio / Soul3 / old replays / pit safety
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Importar Godot
        run: godot --headless --single-threaded-scene --path . --import
      - name: Testar radio original, Soul3, replay legado e emissao reativa
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/race_radio
          run_test() {
            local script="$1"
            local marker="$2"
            timeout 180s godot --headless --single-threaded-scene --path . \
              --script "res://tests/$script" \
              > "ci_artifacts/race_radio/${script%.gd}.log" 2>&1 || {
              cat "ci_artifacts/race_radio/${script%.gd}.log"
              exit 1
            }
            cat "ci_artifacts/race_radio/${script%.gd}.log"
            grep -Fq "$marker" "ci_artifacts/race_radio/${script%.gd}.log"
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|_FAIL)' "ci_artifacts/race_radio/${script%.gd}.log"; then
              exit 1
            fi
          }
          run_test race_radio_06695_test.gd RACE_RADIO_06695_PASS
          run_test driver_soul_06694_test.gd DRIVER_SOUL_06694_PASS
          run_test race_0647_soul2_test.gd SOUL2_PASS
          run_test core_0637_reactive_radio_smoke_test.gd "APEX 0637 PASS"
      - name: Arquivar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-race-radio-06695
          path: ci_artifacts/race_radio/
          retention-days: 14
          if-no-files-found: warn
