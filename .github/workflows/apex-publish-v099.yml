name: APEX - Publicar v0.6.6.9.9 homologada

# This workflow is intentionally installed via a separate PR AFTER #87 is
# merged. It must not mutate the release candidate under active exact-SHA QA.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apex-publish-v099.yml'

permissions:
  contents: read

concurrency:
  group: apex-release-v099
  cancel-in-progress: false

jobs:
  verify-build:
    name: Verificar homologacao e gerar pacotes 9.9
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
      actions: read
      pull-requests: read
    steps:
      - name: Checkout da main publicada
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Exigir PR 87 integrado, commit 9.9 e gate READY no SHA auditado
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          pr_merged="$(gh api "repos/$GH_REPO/pulls/87" --jq '.merged')"
          pr_head="$(gh api "repos/$GH_REPO/pulls/87" --jq '.head.sha')"
          test "$pr_merged" = 'true' || { echo "::error::PR #87 not merged"; exit 1; }
          test "$pr_head" != 'null' && test -n "$pr_head" || { echo "::error::PR #87 has no head"; exit 1; }
          # Query the actual PR HEAD, never a prior QA commit or stale run ID.
          gate_run="$(gh api "repos/$GH_REPO/actions/workflows/apex-race-quality-final-gate.yml/runs?event=pull_request&head_sha=$pr_head&per_page=100" --jq '[.workflow_runs[] | select(.head_sha == "'${pr_head}'" and .event == "pull_request" and .conclusion == "success")] | sort_by(.created_at) | last | .id')"
          test -n "$gate_run" && test "$gate_run" != "null" || {
            echo "::error::No successful READY 19/19 gate for PR #87 exact HEAD $pr_head"; exit 1;
          }
          gate_sha="$(gh api "repos/$GH_REPO/actions/runs/$gate_run" --jq '.head_sha')"
          test "$gate_sha" = "$pr_head" || { echo "::error::Gate SHA mismatch"; exit 1; }
          grep -Fqx 'config/name="APEX Motorsport Manager v0.6.6.9.9 — Core 2"' project.godot
          grep -Fq 'config/description="v0.6.6.9.9:' project.godot
          test -f docs/APEX_RELEASE_v0.6.6.9.9_RACE_QUALITY.md
          echo "APEX_RELEASE_099_QA_GATE_PASS $pr_head gate_run=$gate_run"

      - name: Instalar Godot 4.7.2 e templates oficiais
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Testar empacotamento e importar o projeto real
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tools/tests -p 'test_package_desktop_exports.py' -v
          for attempt in 1 2 3; do
            rm -rf .godot
            set +e
            timeout 180s godot --headless --single-threaded-scene --path . --import > "godot-import-$attempt.log" 2>&1
            code=$?
            set -e
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' "godot-import-$attempt.log"; then
              cat "godot-import-$attempt.log"; exit 1
            fi
            if test "$code" -eq 0; then echo "APEX_RELEASE_099_IMPORT_PASS"; break; fi
            if test "$attempt" -eq 3 || { test "$code" -ne 139 && test "$code" -ne 134; }; then
              cat "godot-import-$attempt.log"; exit "$code"
            fi
            echo "Retry isolated native Godot importer crash ($code)" >&2
          done

      - name: Regressao curta de chuva, box e replay 020
        shell: bash
        run: |
          set -euo pipefail
          for test in wet_strategy_06698_test.gd pit_coordination_06697_test.gd replay_0660_test.gd; do
            timeout 240s godot --headless --single-threaded-scene --path . \
              --script "res://tests/$test" > "release-$test.log" 2>&1 || {
              cat "release-$test.log"; exit 1;
            }
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|_FAIL)' "release-$test.log"; then
              cat "release-$test.log"; exit 1
            fi
          done
          grep -Fq WET_STRATEGY_06698_PASS release-wet_strategy_06698_test.gd.log
          grep -Fq PIT_COORD_06697_PASS release-pit_coordination_06697_test.gd.log
          echo APEX_RELEASE_099_REGRESSIONS_PASS

      - name: Exportar Windows e Linux e conferir PCK real
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/linux builds/windows dist
          godot --headless --path . --export-release "APEX Linux x86_64" \
            builds/linux/APEX_Motorsport_Manager.x86_64 > export-linux.log 2>&1 || {
              cat export-linux.log; exit 1;
            }
          godot --headless --path . --export-release "APEX Windows x86_64" \
            builds/windows/APEX_Motorsport_Manager.exe > export-windows.log 2>&1 || {
              cat export-windows.log; exit 1;
            }
          python3 - <<'PY'
          from pathlib import Path
          name=b"APEX Motorsport Manager v0.6.6.9.9"
          for platform in ('linux','windows'):
              p=Path('builds')/platform/'APEX_Motorsport_Manager.pck'
              assert p.is_file() and name in p.read_bytes(), (platform, "release PCK version mismatch")
              print("APEX_RELEASE_099_PCK_PASS",platform)
          PY
          python3 tools/package_desktop_exports.py \
            --builds builds --output dist --godot-version 4.7.2-stable

      - name: Teste de inicializacao real Linux
        shell: bash
        run: |
          set -euo pipefail
          chmod +x builds/linux/APEX_Motorsport_Manager.x86_64
          timeout 90s builds/linux/APEX_Motorsport_Manager.x86_64 \
            --headless --quit-after 120 > release-linux-smoke.log 2>&1 || {
              cat release-linux-smoke.log; exit 1;
            }
          if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' release-linux-smoke.log; then
            cat release-linux-smoke.log; exit 1
          fi
          echo APEX_RELEASE_099_LINUX_SMOKE_PASS

      - name: Gerar fonte versionada, hashes e certificado de origem
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess,zipfile
          from pathlib import Path
          package='APEX_Motorsport_Manager_v0.6.6.9.9_Godot_source'
          with zipfile.ZipFile('dist/'+package+'.zip','w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for raw in subprocess.check_output(['git','ls-files','-z']).split(b'\0'):
                  if not raw: continue
                  name=raw.decode('utf-8')
                  if name.startswith('docs/arquivo/pacotes/'): continue
                  z.write(name,package+'/'+name)
          with zipfile.ZipFile('dist/'+package+'.zip') as z:
              assert z.testzip() is None
              assert package+'/project.godot' in z.namelist()
          PY
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt
          python3 - <<'PY'
          import json,subprocess
          from pathlib import Path
          m=json.loads(Path('dist/manifest.json').read_text())
          assert m['status']=='PASS'
          assert set(m['platforms'])=={'linux','windows'}
          for p in m['platforms'].values():
              assert (Path('dist')/p['archive']).is_file()
          assert Path('dist/SOURCE_COMMIT.txt').read_text().strip()==subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          PY
          echo APEX_RELEASE_099_PACKAGE_PASS

      - name: Arquivar os pacotes validados e evidencias
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-v0-6-6-9-9-official-packages
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          retention-days: 30
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publicar tag e GitHub Release somente apos QA e exportacao
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Recuperar pacotes da mesma execucao validada
        uses: actions/download-artifact@v4
        with:
          name: apex-v0-6-6-9-9-official-packages
          path: dist

      - name: Confirmar integridade e commit publicado
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist/SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('dist/manifest.json').read_text())
          assert m['status']=='PASS'
          assert set(m['platforms'])=={'linux','windows'}
          for target in m['platforms'].values():
              assert (Path('dist')/target['archive']).is_file()
          PY

      - name: Publicar release imutavel v0.6.6.9.9
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.6.6.9.9"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::Release $tag exists: refusing to overwrite."
            exit 1
          fi
          cat > release-notes.md <<EOF
          # APEX Motorsport Manager v0.6.6.9.9 — Race Quality Release

          GitHub main commit: \`$GITHUB_SHA\`
          Validated PR: #87 (exact QA head published at https://github.com/$GH_REPO/pull/87).
          Release gate required: READY 19/19 on the same QA head.

          **Downloads:** Windows x86_64 ZIP, Linux x86_64 ZIP, and Godot source ZIP.
          **Checks:** Godot 4.7.2 import, wet strategy, pit coordination, replay, verified embedded PCK identity,
          native Linux headless smoke test, ZIP content integrity and SHA-256 manifests.
          **Sports:** F1 2012, V21 manual stops, replay revision 020 and legacy save compatibility preserved.
          **Limitations:** Windows is cross-exported, not run on a native Windows PC.
          GPU FPS and real graphical play on user hardware are not tested by headless CI.
          The 5.8772s Monza pit delay remains a REVIEW observation, not a confirmed avoidable bug.
          EOF
          gh release create "$tag" \
            dist/*.zip dist/manifest.json dist/SHA256SUMS.txt dist/SOURCE_COMMIT.txt \
            --target "$GITHUB_SHA" \
            --title "APEX Motorsport Manager v0.6.6.9.9 — Race Quality (Windows/Linux/Godot)" \
            --notes-file release-notes.md \
            --latest
