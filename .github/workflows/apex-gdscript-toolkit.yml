name: APEX - Auditoria GDScript Toolkit

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  gdscript-toolkit:
    name: gdlint + gdformat (informativo)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar codigo do APEX
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Instalar GDScript Toolkit para Godot 4
        run: |
          python -m pip install --disable-pip-version-check 'gdtoolkit==4.5.0'
          gdlint --version
          gdformat --version

      - name: Validar o gerador do relatorio
        run: |
          python -m unittest discover -s tools/tests \
            -p 'test_gdscript_style_audit.py' -v

      - name: Auditar scripts proprios sem alterar arquivos
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/gdscript-toolkit
          mapfile -d '' gd_files < <(find scripts -type f -name '*.gd' -print0 | LC_ALL=C sort -z)
          test "${#gd_files[@]}" -gt 0

          gdlint --version > ci_artifacts/gdscript-toolkit/version.log 2>&1
          set +e
          gdlint "${gd_files[@]}" > ci_artifacts/gdscript-toolkit/gdlint.log 2>&1
          lint_status=$?
          gdformat --check "${gd_files[@]}" > ci_artifacts/gdscript-toolkit/gdformat.log 2>&1
          format_status=$?
          set -e

          python tools/gdscript_style_audit.py \
            --gdlint-status "$lint_status" \
            --gdformat-status "$format_status" \
            --output-dir ci_artifacts/gdscript-toolkit
          git diff --exit-code -- scripts

      - name: Exibir resumo da auditoria
        if: always()
        shell: bash
        run: |
          if [ -f ci_artifacts/gdscript-toolkit/report.md ]; then
            cat ci_artifacts/gdscript-toolkit/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f ci_artifacts/gdscript-toolkit/error.txt ]; then
            echo '### GDScript Toolkit: ferramenta nao concluiu a auditoria' >> "$GITHUB_STEP_SUMMARY"
            cat ci_artifacts/gdscript-toolkit/error.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar logs e JSON da auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-gdscript-toolkit-auditoria
          path: ci_artifacts/gdscript-toolkit/
          retention-days: 14
          if-no-files-found: warn
