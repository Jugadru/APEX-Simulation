name: APEX - Strategy Staff Intelligence (v9.10)
on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/strategy_staff_066910_test.gd'
      - 'tests/ci/apex_strategy_staff_full_gp_066910.gd'
      - 'tests/wet_strategy_06698_test.gd'
      - 'project.godot'
      - '.github/workflows/apex-strategy-staff-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  strategy-staff:
    name: Godot 4.7.2 / estrategista / V21 / replay 020-021
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Importar projeto
        run: godot --headless --single-threaded-scene --path . --import
      - name: QA dirigido e regressão obrigatória
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/strategy_staff_066910
          run_test() {
            local script="$1"
            local marker="$2"
            timeout 240s godot --headless --single-threaded-scene --path . \
              --script "res://tests/$script" \
              > "ci_artifacts/strategy_staff_066910/$script.log" 2>&1 || {
              cat "ci_artifacts/strategy_staff_066910/$script.log"
              exit 1
            }
            cat "ci_artifacts/strategy_staff_066910/$script.log"
            grep -Fq "$marker" "ci_artifacts/strategy_staff_066910/$script.log"
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|_FAIL)' "ci_artifacts/strategy_staff_066910/$script.log"; then
              exit 1
            fi
          }
          run_test strategy_staff_066910_test.gd STRATEGY_STAFF_066910_PASS
          run_test wet_strategy_06698_test.gd WET_STRATEGY_06698_PASS
          run_test pit_coordination_06697_test.gd PIT_COORD_06697_PASS
          run_test pit_queue_prevention_066971_test.gd PIT_QUEUE_066971_PASS
          run_test pitwall_prediction_06696_test.gd PITWALL_LEDGER_06696_PASS
      - name: Publicar logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-strategy-staff-066910
          path: ci_artifacts/strategy_staff_066910/
          retention-days: 14
          if-no-files-found: warn

  full-gp-strategy-staff:
    name: Silverstone e Monza / GP completo / staff IA + V21 / determinismo
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Preparar Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Importar projeto
        run: godot --headless --single-threaded-scene --path . --import
      - name: Executar quatro GPs completos com dois percursos e sementes fixas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/staff_full_gp
          for scenario in 'GBR|Seco|6610' 'ITA|Variável|6611'; do
            IFS='|' read -r circuit weather seed <<< "$scenario"
            log="ci_artifacts/staff_full_gp/${circuit}_${seed}.log"
            export APEX_TRACK="$circuit" APEX_WEATHER="$weather" APEX_SEED="$seed"
            timeout 720s godot --headless --single-threaded-scene --path . \
              --script res://tests/ci/apex_strategy_staff_full_gp_066910.gd \
              > "$log" 2>&1 || { cat "$log"; exit 1; }
            grep -Fq 'APEX_STAFF_FULL_GP_PASS' "$log"
            if grep -Eiq '(SCRIPT ERROR:|Parse Error:|APEX_STAFF_FULL_GP_FAIL)' "$log"; then
              cat "$log"
              exit 1
            fi
            grep -F 'APEX_STAFF_FULL_GP_PASS' "$log"
          done
      - name: Arquivar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-staff-full-gp-066910
          path: ci_artifacts/staff_full_gp/
          retention-days: 14
          if-no-files-found: warn
