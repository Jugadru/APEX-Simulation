name: APEX - Comparador de Benchmarks A-B

on:
  pull_request:
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Branch, tag ou SHA de referencia'
        required: true
        default: 'main'
        type: string
      candidate_ref:
        description: 'Branch, tag ou SHA candidata'
        required: true
        default: 'main'
        type: string

permissions:
  contents: read

jobs:
  compare-cpu:
    name: A-B CPU / mesmo seed e hash
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout da referencia
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: base
          ref: ${{ github.event.pull_request.base.sha || inputs.baseline_ref || 'main' }}
          persist-credentials: false

      - name: Checkout da versao candidata
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: candidate
          ref: ${{ github.event.pull_request.head.sha || inputs.candidate_ref || github.sha }}
          persist-credentials: false

      - name: Checkout de ferramentas confiaveis da main atual
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: ci-tooling
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: tools
          sparse-checkout-cone-mode: true

      - name: Selecionar comparador e testar politica de compatibilidade
        shell: bash
        run: |
          set -euo pipefail
          choose_root() {
            local candidate_root="$1"
            local trusted_root="$2"
            local candidate_tool="$candidate_root/tools/compare_apex_benchmarks.py"
            local candidate_tests="$candidate_root/tools/tests/test_compare_apex_benchmarks.py"
            local trusted_tool="$trusted_root/tools/compare_apex_benchmarks.py"
            local trusted_tests="$trusted_root/tools/tests/test_compare_apex_benchmarks.py"
            if [[ -e "$candidate_tool" || -e "$candidate_tests" ]]; then
              # Candidate carries comparator: both scripts must be complete.
              test -s "$candidate_tool" && test -s "$candidate_tests" || return 1
              printf '%s' "$candidate_root"
            else
              # The historical PR base SHA may predate the comparator too.
              # Use independent, current main tooling; never trust stale base.
              test -s "$trusted_tool" && test -s "$trusted_tests" || return 1
              printf '%s' "$trusted_root"
            fi
          }

          # Run a focused contract smoke with a synthetic legacy checkout,
          # a partial implementation (must reject), and a complete candidate.
          scratch="$(mktemp -d)"
          trap 'rm -rf "$scratch"' EXIT
          mkdir -p "$scratch/legacy" "$scratch/partial/tools" "$scratch/current/tools/tests"
          test "$(choose_root "$scratch/legacy" ci-tooling)" = "ci-tooling"
          printf 'partial\n' > "$scratch/partial/tools/compare_apex_benchmarks.py"
          if choose_root "$scratch/partial" ci-tooling >/dev/null; then
            echo "::error::Partial comparator was incorrectly accepted"
            exit 1
          fi
          cp ci-tooling/tools/compare_apex_benchmarks.py "$scratch/current/tools/"
          cp ci-tooling/tools/tests/test_compare_apex_benchmarks.py "$scratch/current/tools/tests/"
          test "$(choose_root "$scratch/current" ci-tooling)" = "$scratch/current"
          echo "APEX_AB_TOOL_SELECTION_TESTS_PASS"

          tool_root="$(choose_root candidate ci-tooling)"
          echo "APEX_AB_TOOLS_ROOT=$tool_root" >> "$GITHUB_ENV"
          echo "APEX A/B comparator source: $tool_root" >> "$GITHUB_STEP_SUMMARY"

      - name: Preparar Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable

      - name: Testar o comparador sem Godot
        run: python3 -m unittest discover -s "$APEX_AB_TOOLS_ROOT/tools/tests" -p 'test_compare_apex_benchmarks.py' -v

      - name: Importar referencia
        run: godot --headless --path base --import

      - name: Importar candidata
        run: godot --headless --path candidate --import

      - name: Rodar benchmarks alternados
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p benchmark-ab
          for index in 0 1 2 3; do
            if (( index % 2 == 0 )); then
              order=(base candidate)
            else
              order=(candidate base)
            fi
            for label in "${order[@]}"; do
              export HOME="$RUNNER_TEMP/apex-ab-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${label}-${index}"
              export XDG_DATA_HOME="$HOME/data"
              export XDG_CONFIG_HOME="$HOME/config"
              export XDG_CACHE_HOME="$HOME/cache"
              mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
              APEX_TICKS=1000 godot --headless --path "$label" \
                --script res://tests/high_speed_growth_066723_benchmark.gd \
                > "benchmark-ab/${label}-${index}.log" 2>&1
            done
          done
          python3 "$APEX_AB_TOOLS_ROOT/tools/compare_apex_benchmarks.py" \
            --base-dir base \
            --candidate-dir candidate \
            --ticks 1000 \
            --repetitions 3 \
            --output-dir benchmark-ab

      - name: Mostrar resumo A-B
        if: always()
        shell: bash
        run: |
          if [ -f benchmark-ab/report.md ]; then
            cat benchmark-ab/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f benchmark-ab/error.txt ]; then
            echo "### Benchmark A-B: erro" >> "$GITHUB_STEP_SUMMARY"
            cat benchmark-ab/error.txt >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Guardar logs, JSON e comparacao
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-benchmark-ab
          path: benchmark-ab/
          retention-days: 14
          if-no-files-found: warn
