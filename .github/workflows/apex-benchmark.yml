name: APEX - Benchmark Automatico

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/performance_baseline_06690.gd'
      - '.github/workflows/apex-benchmark.yml'
      - 'scripts/**'
      - 'data/**'
      - 'project.godot'

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Baixar codigo APEX
        uses: actions/checkout@v4

      - name: Preparar Godot
        uses: lihop/godot-setup@v3.0.1
        with:
          version: 4.7.2-stable

      - name: Importar projeto
        run: godot --headless --path . --import

      - name: Medir desempenho do motor (benchmark legado)
        env:
          APEX_TICKS: "500"
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . \
            --script res://tests/high_speed_growth_066723_benchmark.gd \
            2>&1 | tee benchmark.log
          grep -q 'GROWTH_DONE' benchmark.log

      - name: Performance Baseline 2.0 - 24 carros, 1x/10x/16x/32x
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline-06690
          for speed in 1 10 16 32; do
            export APEX_BASELINE_SPEED="$speed"
            export APEX_BASELINE_TICKS=180
            export APEX_BASELINE_TRACK=ITA
            export APEX_BASELINE_WEATHER=Seco
            export APEX_BASELINE_SEED=660
            export APEX_BASELINE_PROFILE=1
            export APEX_BASELINE_OUTPUT="$PWD/baseline-06690/monza-${speed}x.json"
            timeout 240s godot --headless --path . \
              --script res://tests/performance_baseline_06690.gd \
              > "baseline-06690/monza-${speed}x.log" 2>&1
            grep -q 'APEX_BASELINE_06690_DONE' "baseline-06690/monza-${speed}x.log"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          output = Path("baseline-06690")
          lines = ["# Performance Baseline 2.0 (headless)", "", "| Speed | Ticks | CPU wall s | Frame CPU p95 ms | Hash reference |", "|---|---:|---:|---:|---|"]
          for speed in (1, 10, 16, 32):
              data = json.loads((output / f"monza-{speed}x.json").read_text())
              assert data["status"] == "PASS", f"{speed}x has failed"
              assert data["config"]["cars"] == 24
              assert data["config"]["requested_speed_x"] == speed
              assert data["state"]["hash_equal"]
              assert data["cpu"]["ticks"] >= 180
              lines.append(f'| {speed}x | {data["cpu"]["ticks"]} | {data["cpu"]["wall_seconds"]:.3f} | {data["cpu"]["frame_cpu_p95_ms"]:.3f} | matched |')
          lines += ["", "These are synthetic headless frame-input CPU timings, not measured game FPS or actual acceleration on a player's computer."]
          (output / "report.md").write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
          cat baseline-06690/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Baseline por circuito, chuva, RSS e impacto do profiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p baseline-06690
          run_case() {
            local code="$1"
            local weather="$2"
            local label="$3"
            export APEX_BASELINE_TRACK="$code"
            export APEX_BASELINE_WEATHER="$weather"
            export APEX_BASELINE_SPEED=16
            export APEX_BASELINE_TICKS=180
            export APEX_BASELINE_SEED=660
            export APEX_BASELINE_OUTPUT="$PWD/baseline-06690/$label.json"
            /usr/bin/time -f 'elapsed_s=%e user_s=%U system_s=%S cpu_pct=%P peak_rss_kb=%M' \
              -o "baseline-06690/$label.metrics" \
              timeout 240s godot --headless --path . \
                --script res://tests/performance_baseline_06690.gd \
                > "baseline-06690/$label.log" 2>&1
            grep -q 'APEX_BASELINE_06690_DONE' "baseline-06690/$label.log"
          }
          export APEX_BASELINE_PROFILE=1
          run_case GBR Seco silverstone_dry
          run_case BEL Seco spa_dry
          run_case SIN Seco singapore_dry
          run_case BEL 'Chuva intensa' spa_wet
          run_case SIN 'Chuva intensa' singapore_wet
          export APEX_BASELINE_PROFILE=0
          run_case ITA Seco monza_profiler_off
          python3 - <<'PY'
          import json
          from pathlib import Path
          folder = Path("baseline-06690")
          for label in ("silverstone_dry", "spa_dry", "singapore_dry", "spa_wet", "singapore_wet", "monza_profiler_off"):
              data = json.loads((folder / (label + ".json")).read_text())
              assert data["status"] == "PASS", label
              assert data["config"]["cars"] == 24, label
              assert data["state"]["hash_equal"], label
              assert data["cpu"]["ticks"] >= 180, label
              assert (folder / (label + ".metrics")).is_file(), label
              print(label, data["cpu"]["ticks"], data["cpu"]["wall_seconds"], (folder / (label + ".metrics")).read_text().strip())
          on = json.loads((folder / "monza-16x.json").read_text())
          off = json.loads((folder / "monza_profiler_off.json").read_text())
          assert on["cpu"]["ticks"] == off["cpu"]["ticks"]
          assert on["state"]["final_hash"] == off["state"]["final_hash"], "Profiler changed sporting hash"
          assert off["config"]["trace_enabled"] is False
          print("APEX_BASELINE_06690_PROFILE_OFF_ON_HASH_MATCH")
          PY

      - name: Salvar relatorio
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-benchmark-relatorio
          path: |
            benchmark.log
            baseline-06690/
          if-no-files-found: warn
