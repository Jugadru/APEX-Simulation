name: APEX - Overtaking Intelligence (v9.12)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overtaking-targeted:
    name: Godot 4.7.2 / lane decisions / 022-023 replay / V21
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Import actual Godot project
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            rm -rf .godot
            set +e
            timeout 240s godot --headless --single-threaded-scene --path . --import > import.log 2>&1
            status=$?
            set -e
            if grep -Eiq '(SCRIPT ERROR:|Parse Error:)' import.log; then cat import.log; exit 1; fi
            if [ "$status" -eq 0 ]; then
              if grep -Eiq '^ERROR:' import.log; then cat import.log; exit 1; fi
              cat import.log
              break
            fi
            if [ "$attempt" -eq 2 ] || { [ "$status" -ne 134 ] && [ "$status" -ne 139 ]; }; then
              cat import.log
              exit "$status"
            fi
            echo "Native Godot import crash ($status); retrying once"
          done
      - name: Targeted racecraft, replay and legacy regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/overtaking_066912
          run_test() {
            local script="$1"
            local marker="$2"
            local log="ci_artifacts/overtaking_066912/${script}.log"
            timeout 240s godot --headless --single-threaded-scene --path . \
              --script "res://tests/${script}" > "${log}" 2>&1 || {
              cat "${log}"
              exit 1
            }
            cat "${log}"
            grep -Fq "${marker}" "${log}"
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|OVERTAKING_066912_FAIL)' "${log}"; then
              exit 1
            fi
          }
          run_test overtaking_066912_test.gd OVERTAKING_066912_PASS
          run_test driver_dynamics_0661_test.gd DRIVER_DYNAMICS_0661_PASS
          run_test racecraft_06688_grip_defense_test.gd RACECRAFT_06688_GRIP_PASS
          run_test race_start_066911_test.gd RACE_START_066911_PASS
          run_test replay_0660_test.gd REPLAY_UNIT_PASS
          run_test team_orders_066810_test.gd TEAM_ORDERS_066810_PASS
      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-overtaking-066912
          path: |
            ci_artifacts/overtaking_066912/
            import.log
          retention-days: 14
          if-no-files-found: warn
