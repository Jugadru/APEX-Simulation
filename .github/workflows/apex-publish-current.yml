name: APEX - Publicar Core 2 atual (Windows e Linux)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apex-publish-current.yml'
  push:
    branches: [main]
    paths:
      - '.github/workflows/apex-publish-current.yml'

permissions:
  contents: read

concurrency:
  group: apex-publish-core2-066810
  cancel-in-progress: false

jobs:
  verify-and-build:
    name: Construir e validar distribuicao atual
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Instalar Godot 4.7.2 e templates oficiais
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
          export-templates: true

      - name: Validar versao e empacotador
        shell: bash
        run: |
          set -euo pipefail
          godot --version
          grep -Fq 'v0.6.6.8.10' project.godot
          python3 -m unittest discover -s tools/tests -p 'test_package_desktop_exports.py' -v

      - name: Importar projeto atual no Godot
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --single-threaded-scene --path . --import > godot-import.log 2>&1 || { cat godot-import.log; exit 1; }
          if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' godot-import.log; then
            cat godot-import.log
            exit 1
          fi

      - name: Executar testes esportivos e replay
        shell: bash
        run: |
          set -euo pipefail
          for test in core2_06686_sort_contract.gd team_orders_066810_test.gd replay_0660_test.gd pit_incidents_double_stack_test.gd car_model_smoke_test.gd; do
            timeout 240s godot --headless --single-threaded-scene --path . --script "res://tests/$test" > "check-$test.log" 2>&1 || { cat "check-$test.log"; exit 1; }
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|_FAIL)' "check-$test.log"; then
              cat "check-$test.log"
              exit 1
            fi
          done

      - name: Exportar Windows e Linux
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p builds/linux builds/windows dist
          godot --headless --path . --export-release "APEX Linux x86_64" builds/linux/APEX_Motorsport_Manager.x86_64
          godot --headless --path . --export-release "APEX Windows x86_64" builds/windows/APEX_Motorsport_Manager.exe
          test -s builds/linux/APEX_Motorsport_Manager.pck
          test -s builds/windows/APEX_Motorsport_Manager.pck
          python3 tools/package_desktop_exports.py --builds builds --output dist --godot-version 4.7.2-stable

      - name: Smoke Linux com binario exportado
        shell: bash
        run: |
          set -euo pipefail
          chmod +x builds/linux/APEX_Motorsport_Manager.x86_64
          timeout 90s builds/linux/APEX_Motorsport_Manager.x86_64 --headless --quit-after 120 > linux-runtime-smoke.log 2>&1 || { cat linux-runtime-smoke.log; exit 1; }

      - name: Gerar ZIP Godot de fonte atual
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import subprocess, zipfile
          from pathlib import Path
          files = subprocess.check_output(['git','ls-files','-z']).split(b'\0')
          path = Path('dist/APEX_Motorsport_Manager_v0.6.6.8.10_Godot_source.zip')
          with zipfile.ZipFile(path,'w',zipfile.ZIP_DEFLATED,compresslevel=6) as z:
              for raw in files:
                  if not raw:
                      continue
                  name = raw.decode('utf-8')
                  if name.startswith('docs/arquivo/pacotes/'):
                      continue # Pacote historico ja arquivado; sem dependencia de runtime.
                  z.write(name, 'APEX_Motorsport_Manager_v0.6.6.8.10/' + name)
          with zipfile.ZipFile(path) as z:
              assert z.testzip() is None
              assert 'APEX_Motorsport_Manager_v0.6.6.8.10/project.godot' in z.namelist()
          PY
          (cd dist && sha256sum *.zip > SHA256SUMS.txt)
          git rev-parse HEAD > dist/SOURCE_COMMIT.txt

      - name: Salvar pacotes e evidencias
        uses: actions/upload-artifact@v4
        with:
          name: apex-core2-066810-current-release
          path: |
            dist/*.zip
            dist/manifest.json
            dist/SHA256SUMS.txt
            dist/SOURCE_COMMIT.txt
          retention-days: 14
          compression-level: 0
          if-no-files-found: error

  publish:
    name: Publicar nova release se todos testes passarem
    needs: verify-and-build
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: Recuperar pacotes verificados deste mesmo workflow
        uses: actions/download-artifact@v4
        with:
          name: apex-core2-066810-current-release
          path: dist

      - name: Conferir origem e integridade
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat dist/SOURCE_COMMIT.txt)" = "$GITHUB_SHA"
          (cd dist && sha256sum --check SHA256SUMS.txt)
          python3 - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('dist/manifest.json').read_text())
          assert m['status']=='PASS'
          assert set(m['platforms'])=={'linux','windows'}
          for p in m['platforms'].values():
              assert (Path('dist')/p['archive']).is_file()
          PY

      - name: Criar release publica para commit exato
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          tag="v0.6.6.8.10-core2-current"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "::error::A release $tag ja existe: nao sobrescrever um pacote com outro SHA."
            exit 1
          fi
          cat > release-notes.md <<EOF
          # APEX Motorsport Manager - Core 2 v0.6.6.8.10
          Distribuicao recompilada da branch main, commit \`$GITHUB_SHA\`, usando Godot 4.7.2-stable.

          **Arquivos:** ZIP Windows x86_64, ZIP Linux x86_64 e ZIP do projeto Godot.
          **Verificacoes:** importacao real do Godot, testes esportivos e replay, integridade do PCK/ZIP, hashes SHA-256 e inicializacao headless Linux.
          **Limitacoes:** o executavel Windows foi gerado por cross-export; nao houve execucao em Windows real, nem assinatura digital. Testes de FPS/GUI no hardware do jogador continuam recomendados.
          **Compatibilidade:** por mudancas de regras e revisionamento, replays esportivos de versoes anteriores podem ser recusados. Preserve backup dos saves/replays.
          **Historico:** a v0.6.6.8.6 permanece disponivel na Release Versions.

          A versao identificada no projeto e v0.6.6.8.10; as refatoracoes 01-06 e melhorias de organizacao da main estao incluidas neste snapshot.
          EOF
          gh release create "$tag" dist/*.zip dist/manifest.json dist/SHA256SUMS.txt dist/SOURCE_COMMIT.txt \
            --target "$GITHUB_SHA" \
            --title "APEX Core 2 v0.6.6.8.10 - Windows, Linux e Godot" \
            --notes-file release-notes.md \
            --latest
