name: APEX - Temporary Source Snapshot for Local Portrait Validation
on:
  push:
    branches: [feature/apex-orange-portraits-hud-066815]
    paths: ['.github/workflows/apex-portrait-local-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source for experimental branch
        uses: actions/checkout@v4
      - name: Package original project source without previous release archives
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa_source
          tar -czf qa_source/apex-source-066844.tar.gz --exclude='./.git' --exclude='./.godot' --exclude='./APEX_v0.6.6.8.zip.part*' --exclude='./qa_source' .
          ls -lh qa_source/apex-source-066844.tar.gz
      - name: Share source snapshot for local offline real-asset QA
        uses: actions/upload-artifact@v4
        with:
          name: apex-experimental-source-snapshot-066844
          path: qa_source/apex-source-066844.tar.gz
          retention-days: 1
          if-no-files-found: error
