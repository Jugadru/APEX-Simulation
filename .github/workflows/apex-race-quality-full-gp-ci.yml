name: APEX - Race Quality 9.9 Full GPs

on:
  pull_request:
    branches: [main]
    paths:
      - 'project.godot'
      - 'docs/APEX_RELEASE_v0.6.6.9.9_RACE_QUALITY.md'
      - 'tests/ci/apex_full_gp_endurance.gd'
      - 'tools/apex_race_quality_full_gp.py'
      - 'tools/tests/test_apex_race_quality_full_gp.py'
      - '.github/workflows/apex-race-quality-full-gp-ci.yml'

permissions:
  contents: read

concurrency:
  group: apex-race-quality-full-gp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  full-quality-gps:
    if: github.head_ref == 'qa/v0.6.6.9.9-race-quality'
    name: Silverstone e Monza / seco, variavel, chuva intensa (12 GPs)
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - name: Checkout APEX
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable

      - name: Validate evidence parser contracts
        run: |
          python3 -m unittest discover -s tools/tests \
            -p 'test_apex_race_quality_full_gp.py' -v

      - name: Import real Godot project (retry only native crash)
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            rm -rf .godot
            set +e
            timeout 240s godot --headless --single-threaded-scene --path . --import \
              > "full-gp-import-${attempt}.log" 2>&1
            status=$?
            set -e
            if grep -Eiq 'SCRIPT ERROR:|Parse Error:|^ERROR:' "full-gp-import-${attempt}.log"; then
              cat "full-gp-import-${attempt}.log"
              exit 1
            fi
            if [ "$status" -eq 0 ]; then
              echo "APEX_FULL_GP_IMPORT_PASS attempt=$attempt"
              exit 0
            fi
            if [ "$status" -ne 134 ] && [ "$status" -ne 139 ]; then
              cat "full-gp-import-${attempt}.log"
              exit "$status"
            fi
            if [ "$attempt" -eq 3 ]; then
              cat "full-gp-import-${attempt}.log"
              exit "$status"
            fi
          done

      - name: Run six full-distance scenarios twice and compare real Godot evidence
        shell: bash
        run: |
          set -euo pipefail
          out="$PWD/ci_artifacts/race_quality_full_gp"
          mkdir -p "$out"
          PYTHONPATH=tools python3 - <<'PY' > "$out/plan.tsv"
          from apex_race_quality_full_gp import scenarios
          for row in scenarios():
              print("\t".join(map(str, row)))
          PY
          while IFS=$'\t' read -r ident circuit weather seed; do
            test -n "$ident"
            for repeat in 1 2; do
              label="${ident}_${repeat}"
              echo "APEX_QUALITY_FULL_GP_START ${label}"
              (
                export HOME="$RUNNER_TEMP/apex-quality-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${label}"
                export XDG_DATA_HOME="$HOME/data"
                export XDG_CONFIG_HOME="$HOME/config"
                export XDG_CACHE_HOME="$HOME/cache"
                mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
                export APEX_TRACK="$circuit" APEX_WEATHER="$weather" APEX_SEED="$seed"
                export APEX_BENCH_OUTPUT="$out/${label}.json"
                /usr/bin/time -f 'elapsed_s=%e peak_rss_kb=%M' \
                  -o "$out/${label}.metrics" \
                  timeout 720s godot --headless --path . \
                    --script res://tests/ci/apex_full_gp_endurance.gd \
                    > "$out/${label}.log" 2>&1
              )
            done
          done < "$out/plan.tsv"
          python3 tools/apex_race_quality_full_gp.py --project . --output "$out"

      - name: Publish proof and limitations
        if: always()
        shell: bash
        run: |
          if test -f ci_artifacts/race_quality_full_gp/report.md; then
            cat ci_artifacts/race_quality_full_gp/report.md >> "$GITHUB_STEP_SUMMARY"
          elif test -f ci_artifacts/race_quality_full_gp/error.txt; then
            cat ci_artifacts/race_quality_full_gp/error.txt >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Full GP matrix FAILED or INCONCLUSIVE: consult logs' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Archive native logs, seed plan, hashes and resource metrics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-race-quality-full-gp-evidence
          path: |
            ci_artifacts/race_quality_full_gp/
            full-gp-import-*.log
          retention-days: 14
          if-no-files-found: warn
