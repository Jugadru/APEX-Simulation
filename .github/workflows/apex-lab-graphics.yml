name: APEX Graphics Lab contract
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/apex_lab_graphics.py'
      - 'tools/tests/test_apex_lab_graphics.py'
      - '.github/workflows/apex-lab-graphics.yml'
permissions:
  contents: read
jobs:
  graphics-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6
        with:
          version: '4.7.2'
          use-dotnet: false
      - name: Software display
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb xauth libgl1 libgl1-mesa-dri
      - name: Execute actual graphics command on exact candidate
        env:
          HEAD: ${{ github.event.pull_request.head.sha }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: python3 tools/apex_lab_command.py execute --command graphics --base "$BASE" --head "$HEAD" --output "$RUNNER_TEMP/apex-graphics"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apex-graphics-contract
          path: ${{ runner.temp }}/apex-graphics/
          retention-days: 7
