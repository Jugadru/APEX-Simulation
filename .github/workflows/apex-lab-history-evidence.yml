name: APEX Performance history evidence
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/apex-lab-history-evidence.yml'
      - 'tools/apex_lab_perf_history.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  historical-artifacts:
    if: github.repository == 'Jugadru/APEX-Simulation' && ((github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.actor == 'Jugadru') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.actor == 'Jugadru'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Retrieve existing successful main observations without running Godot
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 -B tools/apex_lab_perf_history.py --verify-existing --out "$RUNNER_TEMP/history-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: apex-history-evidence
          path: ${{ runner.temp }}/history-evidence/
          retention-days: 30
          if-no-files-found: warn
