name: APEX - Racing Line Intelligence validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/core/race_racing_line_091710.gd'
      - 'scripts/core/race_space_0655.gd'
      - 'scripts/core/race_driver_dynamics_0661.gd'
      - 'scripts/core/race_state_codec_0660.gd'
      - 'scripts/core/race_replay_0660.gd'
      - 'scripts/race_engine.gd'
      - 'tests/racing_line_091710_test.gd'
      - 'tests/racing_follow_091710_test.gd'
      - '.github/workflows/apex-racing-line.yml'
permissions:
  contents: read
jobs:
  line:
    if: github.head_ref == 'feat/v0.6.6.9.17.10-racing-line'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh racing_line_091710_test.gd 2>&1 | tee line.log
          grep -Fq RACING_LINE_091710_PASS line.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' line.log
          bash tools/apex_ci_isolated_test.sh race_traffic_hotfix_09177_test.gd 2>&1 | tee traffic.log
          grep -Fq TRAFFIC_09177_PASS traffic.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' traffic.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-racing-line
          path: |
            import.log
            line.log
            traffic.log
          retention-days: 14
  motion:
    if: github.head_ref == 'feat/v0.6.6.9.17.10-racing-line'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - seed: 42
            climate: Seco
          - seed: 6558
            climate: Seco
          - seed: 6617
            climate: Chuva intensa
    env:
      APEX_VISUAL_TRACK: MON
      APEX_TRAFFIC_SEED: ${{ matrix.seed }}
      APEX_ARC_CLIMATE: ${{ matrix.climate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh traffic_arc_09177_test.gd 2>&1 | tee arc.log
          grep -Fq TRAFFIC_ARC_09177_PASS arc.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' arc.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-racing-line-arc-${{ matrix.seed }}
          path: |
            import.log
            arc.log
          retention-days: 14
  following:
    if: github.head_ref == 'feat/v0.6.6.9.17.10-racing-line'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - track: ITA
            climate: Seco
          - track: GBR
            climate: Seco
          - track: MON
            climate: Seco
          - track: ITA
            climate: Chuva intensa
    env:
      APEX_FOLLOW_TRACK: ${{ matrix.track }}
      APEX_FOLLOW_CLIMATE: ${{ matrix.climate }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh racing_follow_091710_test.gd 2>&1 | tee following.log
          grep -Fq FOLLOW_091710_PASS following.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' following.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-follow-${{ matrix.track }}-${{ matrix.climate }}
          path: |
            import.log
            following.log
          retention-days: 14
