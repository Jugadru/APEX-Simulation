name: APEX - Race Engineer 9.22 validation
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'scripts/apex_commentary.gd'
      - 'scripts/apex_race_hud_0622.gd'
      - 'scripts/presentation/race_communication_0922.gd'
      - 'scripts/presentation/race_radio_06695.gd'
      - 'scripts/core/race_engineer_career_0922.gd'
      - 'scripts/presentation/race_radio_audio_0922.gd'
      - 'scripts/presentation/race_radio_pt_0922.gd'
      - 'scripts/apex_race_session_controller.gd'
      - 'scripts/apex_championship_flow.gd'
      - 'scripts/apex_race_ui_presenter.gd'
      - 'tests/race_engineer_0922_ui_test.gd'
      - 'tests/race_engineer_0922_test.gd'
      - '.github/workflows/apex-race-engineer-0922.yml'
permissions:
  contents: read
jobs:
  contextual_radio:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        track: [ITA, GBR, MON]
        climate: [Seco, Chuva intensa]
        seed: [42, 123]
    env:
      APEX_ENGINEER_TRACK: ${{ matrix.track }}
      APEX_ENGINEER_CLIMATE: ${{ matrix.climate }}
      APEX_ENGINEER_SEED: ${{ matrix.seed }}
      APEX_ENGINEER_TICKS: '1800'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh race_engineer_0922_test.gd 2>&1 | tee engineer.log
          grep -Fq ENGINEER_0922_PASS engineer.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' engineer.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-engineer-${{ matrix.track }}-${{ matrix.climate }}-${{ matrix.seed }}
          path: |
            import.log
            engineer.log
          retention-days: 14

  radio_ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: chickensoft-games/setup-godot@ac93246ea68518a384c1c280a496e5989341f2f6 # v2.4.3
        with:
          version: '4.7.2'
          use-dotnet: false
      - run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri
      - run: bash tools/apex_ci_import.sh import.log
      - run: |
          set -euo pipefail
          bash tools/apex_ci_isolated_test.sh race_engineer_0922_ui_test.gd 2>&1 | tee engineer-ui.log
          grep -Fq ENGINEER_0922_UI_PASS engineer-ui.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' engineer-ui.log
          bash tools/apex_ci_isolated_test.sh race_radio_06695_test.gd 2>&1 | tee legacy-radio.log
          bash tools/apex_ci_isolated_test.sh core_0637_reactive_radio_smoke_test.gd 2>&1 | tee reactive-radio.log
          ! grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' legacy-radio.log reactive-radio.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: apex-engineer-native-ui
          path: |
            qa/engineer_0922/*.png
            import.log
            engineer-ui.log
            legacy-radio.log
            reactive-radio.log
          retention-days: 14
