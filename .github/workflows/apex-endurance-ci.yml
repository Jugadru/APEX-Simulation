name: APEX - Testes de Longa Duracao

on:
  workflow_dispatch:
    inputs:
      growth_ticks:
        description: 'Ticks de stress Monza (2 repeticoes; multiplos de 250)'
        required: true
        type: choice
        options:
          - '6000'
          - '10000'
        default: '6000'
permissions:
  contents: read

concurrency:
  group: apex-endurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  endurance:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    name: Determinismo, GPs, memoria e 20 temporadas de dados
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Baixar APEX
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Instalar Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable

      - name: Verificar contratos de teste Python
        run: |
          python3 -m unittest discover -s tools/tests \
            -p 'test_apex_endurance_ci.py' -v

      - name: Importar projeto Godot
        run: godot --headless --path . --import

      - name: Executar provas de longa duracao
        env:
          APEX_GROWTH_TICKS: ${{ inputs.growth_ticks || '6000' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/endurance
          test -x /usr/bin/time
          output="$PWD/ci_artifacts/endurance"
          run_endurance() {
            local label="$1"
            local script="$2"
            local track="${3:-}"
            local weather="${4:-}"
            local seed="${5:-}"
            (
              export HOME="$RUNNER_TEMP/apex-endurance-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${label}"
              export XDG_DATA_HOME="$HOME/data"
              export XDG_CONFIG_HOME="$HOME/config"
              export XDG_CACHE_HOME="$HOME/cache"
              mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_CACHE_HOME"
              export APEX_TICKS="$APEX_GROWTH_TICKS"
              export APEX_TRACK="$track"
              export APEX_WEATHER="$weather"
              export APEX_SEED="$seed"
              export APEX_BENCH_OUTPUT="$output/${label}.json"
              /usr/bin/time -f '%e %M' -o "$output/${label}.metrics" \
                timeout 450s godot --headless --path . --script "res://${script}" \
                > "$output/${label}.log" 2>&1
            )
          }

          run_endurance growth_monza_1 tests/high_speed_growth_066723_benchmark.gd
          run_endurance growth_monza_2 tests/high_speed_growth_066723_benchmark.gd
          run_endurance full_gp_ITA_1 tests/ci/apex_full_gp_endurance.gd ITA Seco 660
          run_endurance full_gp_ITA_2 tests/ci/apex_full_gp_endurance.gd ITA Seco 660
          run_endurance full_gp_GBR_1 tests/ci/apex_full_gp_endurance.gd GBR 'Chuva intensa' 661
          run_endurance full_gp_GBR_2 tests/ci/apex_full_gp_endurance.gd GBR 'Chuva intensa' 661
          run_endurance career_admin_1 tests/career_0667_20_season_data_stress.gd
          run_endurance career_admin_2 tests/career_0667_20_season_data_stress.gd

          python3 tools/apex_endurance_ci.py \
            --project . \
            --growth-ticks "$APEX_GROWTH_TICKS" \
            --output ci_artifacts/endurance

      - name: Monza 53 voltas e replay deterministico integral
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/endurance
          export APEX_FULL_REPORT="$PWD/ci_artifacts/endurance/monza53_replay.json"
          /usr/bin/time -f 'elapsed_s=%e peak_rss_kb=%M' \
            -o ci_artifacts/endurance/monza53_replay.metrics \
            timeout 900s godot --headless --path . \
              --script res://tests/long_race_full_0663.gd \
              > ci_artifacts/endurance/monza53_replay.log 2>&1
          grep -q 'LRP_FULL_REPLAY_END' ci_artifacts/endurance/monza53_replay.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ci_artifacts/endurance/monza53_replay.json").read_text())
          assert data["full_live_finished"], data
          assert data["full_replay_verified"], data
          assert data["finished_cars"] == 24, data
          assert data["unique_positions"] == 24, data
          assert data["live_ticks"] == data["replay_ticks"], data
          assert len(data["sport_hash"]) == 64, data
          # 06692: the same 53-lap run must document beginning/middle/end.
          # No performance threshold: CI VM contention is not native FPS.
          windows = data.get("live_cpu_windows_06692", [])
          assert len(windows) >= 10, len(windows)
          assert windows[0]["start_tick"] == 0, windows[0]
          assert windows[-1]["end_tick"] == data["live_ticks"], windows[-1]
          for prev, curr in zip(windows, windows[1:]):
              assert prev["end_tick"] == curr["start_tick"], (prev, curr)
          for row in windows:
              assert row["cpu_ms_per_tick"] > 0, row
              assert row["simulated_per_wall_second"] > 0, row
          early, mid, late = windows[0], windows[len(windows)//2], windows[-1]
          print("APEX_SUSTAINED_06692_PASS", json.dumps({
              "live_ticks": data["live_ticks"], "windows": len(windows),
              "early_cpu_ms_tick": early["cpu_ms_per_tick"],
              "middle_cpu_ms_tick": mid["cpu_ms_per_tick"],
              "final_cpu_ms_tick": late["cpu_ms_per_tick"],
              "final_over_early_ratio": late["cpu_ms_per_tick"]/early["cpu_ms_per_tick"],
              "limitations": "headless wall/CPU GP time, not physical GPU FPS or 32x UI effective speed"}))
          print("APEX_MONZA53_REPLAY_06690_PASS", data["live_ticks"], data["sport_hash"])
          PY

      - name: Resumir resultados
        if: always()
        shell: bash
        run: |
          if [ -f ci_artifacts/endurance/report.md ]; then
            cat ci_artifacts/endurance/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f ci_artifacts/endurance/error.txt ]; then
            echo '### APEX Endurance: FAIL ou INCONCLUSIVE' >> "$GITHUB_STEP_SUMMARY"
            cat ci_artifacts/endurance/error.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo 'Os logs permitem inspecionar cada repeticao e falha.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar logs, hashes, snapshots e relatorios
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: apex-endurance-relatorio
          path: ci_artifacts/endurance/
          retention-days: 14
          if-no-files-found: warn
