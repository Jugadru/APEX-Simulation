name: APEX - Capturas Graficas Automaticas

on:
  workflow_dispatch:
  pull_request:

permissions:
  contents: read

jobs:
  screenshots:
    name: Silverstone 2012 - HUD 2D e corrida 3D
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe

    steps:
      - name: Baixar o APEX
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable

      - name: Preparar ambiente grafico virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri

      - name: Importar projeto
        run: godot --headless --path . --import

      - name: Capturar tres imagens reais do APEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/screenshots
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            godot --path . \
            --rendering-method gl_compatibility \
            --rendering-driver opengl3 \
            --script res://tests/ci/apex_capture_screenshots.gd \
            2>&1 | tee ci_artifacts/screenshots/capture.log
          grep -q 'APEX_CAPTURE_CI_PASS' ci_artifacts/screenshots/capture.log

      - name: Verificar PNG, metadados e hashes
        run: python3 tools/verify_ci_captures.py ci_artifacts/screenshots

      - name: Resumir capturas
        if: always()
        shell: bash
        run: |
          echo '### Capturas graficas reais — Silverstone 2012' >> "$GITHUB_STEP_SUMMARY"
          echo 'HUD broadcast 2D, HUD compacta 2D e HUD compacta com corrida 3D.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Imagens PNG, manifest.json e logs nos artefatos desta execucao.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Renderizacao por Xvfb/llvmpipe: nao equivale a GPU ou FPS do jogador.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar imagens e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-capturas-silverstone-2012
          path: ci_artifacts/screenshots/
          retention-days: 14
          if-no-files-found: warn
