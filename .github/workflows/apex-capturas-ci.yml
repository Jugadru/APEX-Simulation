name: APEX - Capturas Graficas Automaticas

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'tests/performance_baseline_06690.gd'
      # Race Quality 9.9 deliberately requests this complete regression.
      - 'docs/APEX_RELEASE_v0.6.6.9.9_RACE_QUALITY.md'
      - 'project.godot'
      - 'scenes/**'
      - 'scripts/**'
      - 'data/**'
      - 'assets/**'
      - 'tests/ci/apex_capture_screenshots.gd'
      - 'tools/verify_ci_captures.py'
      - '.github/workflows/apex-capturas-ci.yml'

permissions:
  contents: read

jobs:
  screenshots:
    name: Silverstone 2012 - HUD 2D e corrida 3D
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LIBGL_ALWAYS_SOFTWARE: '1'
      GALLIUM_DRIVER: llvmpipe

    steps:
      - name: Baixar o APEX
        uses: actions/checkout@v4

      - name: Instalar Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable

      - name: Preparar ambiente grafico virtual
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri

      - name: Importar projeto
        run: godot --headless --path . --import

      - name: Capturar tres imagens reais do APEX
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/screenshots
          xvfb-run -a -s '-screen 0 1920x1080x24' \
            godot --path . \
            --rendering-method gl_compatibility \
            --rendering-driver opengl3 \
            --script res://tests/ci/apex_capture_screenshots.gd \
            2>&1 | tee ci_artifacts/screenshots/capture.log
          grep -q 'APEX_CAPTURE_CI_PASS' ci_artifacts/screenshots/capture.log

      - name: Medir FPS observado, 2D/3D e aceleracao efetiva
        shell: bash
        run: |
          set -euo pipefail
          export APEX_NATIVE_BASELINE_OUTPUT="$PWD/ci_artifacts/screenshots/native_baseline_06690.json"
          timeout 300s xvfb-run -a -s '-screen 0 1920x1080x24' \
            godot --path . \
            --rendering-method gl_compatibility \
            --rendering-driver opengl3 \
            --script res://tests/performance_baseline_native_06690.gd \
            > ci_artifacts/screenshots/native_baseline_06690.log 2>&1
          grep -q 'APEX_NATIVE_BASELINE_06690_PASS' ci_artifacts/screenshots/native_baseline_06690.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ci_artifacts/screenshots/native_baseline_06690.json").read_text())
          cases = data["cases"]
          assert len(cases) == 8
          seen = {(x["resolution"], x["requested_speed_x"]) for x in cases}
          expected = {(res, speed) for res in ("1600x900", "1920x1080") for speed in (1, 10, 16, 32)}
          assert seen == expected, (seen, expected)
          for item in cases:
              assert item["sport_ticks"] > 0
              assert item["observed_fps_including_render"] > 0
              assert item["achieved_sport_speed_x"] > 0
              print(item["resolution"], item["requested_speed_x"], item["visual_mode"],
                    "fps=", round(item["observed_fps_including_render"], 2),
                    "actual_speed_x=", round(item["achieved_sport_speed_x"], 2))
          print("APEX_NATIVE_BASELINE_06690_JSON_VALID")
          PY

      - name: Verificar PNG, metadados e hashes
        run: python3 tools/verify_ci_captures.py ci_artifacts/screenshots

      - name: Resumir capturas
        if: always()
        shell: bash
        run: |
          echo '### Capturas graficas reais — Silverstone 2012' >> "$GITHUB_STEP_SUMMARY"
          echo 'HUD broadcast 2D, HUD compacta 2D e HUD compacta com corrida 3D.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Imagens PNG, manifest.json e logs nos artefatos desta execucao.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Renderizacao por Xvfb/llvmpipe: nao equivale a GPU ou FPS do jogador.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar imagens e relatorios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-capturas-silverstone-2012
          path: ci_artifacts/screenshots/
          retention-days: 14
          if-no-files-found: warn
