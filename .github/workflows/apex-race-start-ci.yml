name: APEX - Race Start Intelligence (v9.11)
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, labeled]
    paths:
      - 'scripts/core/race_start_intelligence_066911.gd'
      - 'scripts/core/race_launch_14.gd'
      - 'scripts/core/race_performance.gd'
      - 'scripts/core/race_state_codec_0660.gd'
      - 'scripts/core/race_replay_0660.gd'
      - 'scripts/race_engine.gd'
      - 'tests/race_start_066911_test.gd'
      - 'tests/strategy_staff_066910_test.gd'
      - '.github/workflows/apex-race-start-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  race-start-targeted:
    name: Godot 4.7.2 / launch physics / 021-022 replay / V21
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Prepare Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Import actual Godot project
        run: godot --headless --single-threaded-scene --path . --import
      - name: Targeted start + legacy + pit/replay regression
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/race_start_066911
          run_test() {
            local script="$1"
            local marker="$2"
            local log="ci_artifacts/race_start_066911/${script}.log"
            timeout 240s godot --headless --single-threaded-scene --path . \
              --script "res://tests/${script}" > "${log}" 2>&1 || {
              cat "${log}"
              exit 1
            }
            cat "${log}"
            grep -Fq "${marker}" "${log}"
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|RACE_START_066911_FAIL|RACE_LAUNCH_14_FAIL|STRATEGY_STAFF_066910_FAIL)' "${log}"; then
              exit 1
            fi
          }
          run_test race_start_066911_test.gd RACE_START_066911_PASS
          run_test race_launch_14_test.gd RACE_LAUNCH_14_PASS
          run_test strategy_staff_066910_test.gd STRATEGY_STAFF_066910_PASS
          run_test replay_0660_test.gd REPLAY_UNIT_PASS
      - name: Upload actual logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-race-start-066911
          path: ci_artifacts/race_start_066911/
          retention-days: 14
          if-no-files-found: warn
