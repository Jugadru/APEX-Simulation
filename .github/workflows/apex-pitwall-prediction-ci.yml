name: APEX - Pit Wall Prediction Ledger (v9.6)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prediction-ledger:
    name: Godot 4.7.2 / forecast ledger / V21 / replay
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Godot 4.7.2
        uses: lihop/godot-setup@9828c040f75b0f51509f2fd9f5e0524989d1a97c # v3.0.1
        with:
          version: 4.7.2-stable
      - name: Importar Godot
        run: godot --headless --single-threaded-scene --path . --import
      - name: Executar testes do Ledger e regressões
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/pitwall_ledger
          run_test() {
            local script="$1"
            local marker="$2"
            timeout 240s godot --headless --single-threaded-scene --path . \
              --script "res://tests/$script" \
              > "ci_artifacts/pitwall_ledger/${script%.gd}.log" 2>&1 || {
              cat "ci_artifacts/pitwall_ledger/${script%.gd}.log"
              exit 1
            }
            cat "ci_artifacts/pitwall_ledger/${script%.gd}.log"
            grep -Fq "$marker" "ci_artifacts/pitwall_ledger/${script%.gd}.log"
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:|_FAIL)' "ci_artifacts/pitwall_ledger/${script%.gd}.log"; then
              exit 1
            fi
          }
          run_test pitwall_prediction_06696_test.gd PITWALL_LEDGER_06696_PASS
          run_test pitwall_0649_strategy_test.gd PITWALL_0649_STRATEGY_PASS
          run_test race_radio_06695_test.gd RACE_RADIO_06695_PASS
      - name: Arquivar evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-pitwall-ledger-06696
          path: ci_artifacts/pitwall_ledger/
          retention-days: 14
          if-no-files-found: warn
