name: APEX - Quality Gate 2.0

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'AUDIT so informa; ENFORCE reprova se qualquer evidencia obrigatoria faltar'
        required: true
        type: choice
        default: audit
        options:
          - audit
          - enforce
      pr_number:
        description: 'Opcional: numero do PR para comparar baseline e candidato'
        required: false
        type: string
      base_sha:
        description: 'Opcional: SHA completo da base do PR para comparacoes'
        required: false
        type: string
  # Every PR must be audited, even if it touches files outside scripts/data.
  pull_request:
    types: [opened, reopened, synchronize, labeled]

permissions:
  contents: read
  actions: read

concurrency:
  group: apex-quality-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-gate-unit:
    name: Quality Gate / testes de contrato
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Baixar APEX
        uses: actions/checkout@v4
      - name: Exercitar criterio fail-closed sem depender de rede
        run: |
          python3 -m unittest discover -s tools/tests \
            -p 'test_apex_quality_gate*.py' -v
          python3 -m unittest discover -s tools/tests -p 'test_apex_dynamic_quality_gate.py' -v

  quality-gate-evidence:
    if: ${{ github.event_name != 'pull_request' || contains(github.event.pull_request.labels.*.name, 'ci:full') }}
    name: Quality Gate / auditoria por SHA
    needs: quality-gate-unit
    runs-on: ubuntu-latest
    timeout-minutes: 26
    env:
      APEX_AUTOMATED_FULL: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:full') }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      APEX_TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      APEX_MODE: ${{ inputs.mode || 'audit' }}
      APEX_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number || '0' }}
      APEX_BASE_SHA: ${{ github.event.pull_request.base.sha || inputs.base_sha || '' }}
    steps:
      - name: Baixar ferramenta confiavel da base do PR
        uses: actions/checkout@v4
        with:
          # The PR's base SHA may predate the Quality Gate. Use trusted current main.
          ref: ${{ github.event.repository.default_branch }}
          path: gate
          persist-credentials: false

      - name: Baixar candidato exato em diretorio separado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: candidate
          persist-credentials: false

      - name: Gate fail-closed por SHA e modulo afetado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci_artifacts/quality_gate
          TRUSTED_ARGS=()
          if grep -Fq -- '--trusted-project' gate/tools/apex_quality_gate.py; then
            TRUSTED_ARGS=(--trusted-project gate)
          fi
          CHANGED_ARGS=()
          if [[ "$APEX_PR_NUMBER" != "0" ]]; then
            # Scope targeted checks using the exact base/candidate diff.
            # The ten original requirements cannot be removed by this file.
            test "$(git -C candidate rev-parse HEAD)" = "$APEX_TARGET_SHA"
            git -C candidate fetch --no-tags --depth=1 origin "$APEX_BASE_SHA"
            python3 - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          base, head = os.environ["APEX_BASE_SHA"], os.environ["APEX_TARGET_SHA"]
          raw = subprocess.check_output(
              ["git", "-C", "candidate", "diff", "--name-only", "-z",
               base, head, "--"], timeout=30)
          paths = sorted({p.decode("utf-8") for p in raw.split(b"\\0") if p})
          if not paths:
              raise SystemExit("APEX_GATE_DIFF_FAIL: empty exact base/head diff")
          Path("ci_artifacts/quality_gate/changed-files.json").write_text(
              json.dumps(paths), encoding="utf-8")
          print(f"APEX_GATE_DIFF_READY changed_files={len(paths)}")
          PY
            CHANGED_ARGS=(--changed-files ci_artifacts/quality_gate/changed-files.json)
          fi
          if [[ "$APEX_AUTOMATED_FULL" != "true" ]]; then
            python3 gate/tools/apex_quality_gate.py \
              --repository "$GITHUB_REPOSITORY" --sha "$APEX_TARGET_SHA" \
              --mode "$APEX_MODE" --wait-seconds 90 \
              --pr-number "$APEX_PR_NUMBER" --base-sha "$APEX_BASE_SHA" \
              --project candidate "${TRUSTED_ARGS[@]}" "${CHANGED_ARGS[@]}" --output ci_artifacts/quality_gate
            exit 0
          fi
          # Parallel FULL workflows already run independently (~14 min for endurance).
          # Bound polling to 20 checks; never spend 70 minutes waiting for invalid evidence.
          for attempt in $(seq 1 20); do
            python3 gate/tools/apex_quality_gate.py \
              --repository "$GITHUB_REPOSITORY" --sha "$APEX_TARGET_SHA" \
              --mode audit --wait-seconds 0 \
              --pr-number "$APEX_PR_NUMBER" --base-sha "$APEX_BASE_SHA" \
              --project candidate "${TRUSTED_ARGS[@]}" "${CHANGED_ARGS[@]}" --output ci_artifacts/quality_gate
            verdict=$(python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("ci_artifacts/quality_gate/report.json").read_text())
          statuses = {item["status"] for item in data["checks"]}
          if data["status"] == "READY" and data["passed"] == data["total"] and data["total"] >= 10:
              print("READY")
          elif statuses.intersection({"FAILED", "JOB_NOT_SUCCESSFUL", "MISSING_WORKFLOW"}):
              print("FAILED")
          else:
              print("PENDING")
          PY
            )
            echo "APEX_CI_FULL_GATE attempt=$attempt verdict=$verdict sha=$APEX_TARGET_SHA"
            if [[ "$verdict" == "READY" ]]; then
              echo "APEX_CI_FULL_GATE_READY dynamic sha=$APEX_TARGET_SHA"
              exit 0
            fi
            if [[ "$verdict" == "FAILED" ]]; then
              cat ci_artifacts/quality_gate/report.md
              exit 1
            fi
            if [[ "$attempt" -lt 20 ]]; then sleep 60; fi
          done
          echo "APEX_CI_FULL_GATE_BLOCKED: missing same-SHA evidence after 20 checks"
          cat ci_artifacts/quality_gate/report.md
          exit 1

      - name: Exibir resultado e pendencias
        if: always()
        shell: bash
        run: |
          if [ -f ci_artifacts/quality_gate/report.md ]; then
            cat ci_artifacts/quality_gate/report.md >> "$GITHUB_STEP_SUMMARY"
          elif [ -f ci_artifacts/quality_gate/error.txt ]; then
            echo '### APEX Quality Gate — erro na coleta de evidencias' >> "$GITHUB_STEP_SUMMARY"
            cat ci_artifacts/quality_gate/error.txt >> "$GITHUB_STEP_SUMMARY"
          fi
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'PR ci:full exige READY para todos os checks, inclusive manifesto do SHA exato. AUDIT manual e informativo; branch protection e independente.' >> "$GITHUB_STEP_SUMMARY"

      - name: Guardar matriz de verificacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-quality-gate-matriz
          path: ci_artifacts/quality_gate/
          retention-days: 14
          if-no-files-found: warn
