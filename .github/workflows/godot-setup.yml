name: APEX Core 2 - Godot 4.7.2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      tier:
        description: 'fast (padrao) ou full local (opcional, sem matriz)'
        required: true
        type: choice
        options: [fast, full]
        default: fast

permissions:
  contents: read

concurrency:
  group: apex-core2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core2-smoke:
    name: Import and Core 2 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      APEX_CI_TIER: ${{ github.event_name == 'workflow_dispatch' && inputs.tier == 'full' && 'full' || 'fast' }}
      APEX_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
      APEX_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4

        with:
          fetch-depth: 0

      - name: Verify fast-tier test routing
        run: python3 -m unittest discover -s tools/tests -p 'test_apex_ci_tiers.py' -v

      - name: Validate LAB performance report contracts
        run: python3 -m unittest discover -s tools/tests -p 'test_apex_lab_perf_report.py' -v

      - name: Install Godot 4.7.2
        uses: lihop/godot-setup@v3.0.1
        with:
          version: 4.7.2-stable

      - name: Verify Godot executable and project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f scripts/race_engine.gd
          godot --version

      - name: Import project (real editor check)
        shell: bash
        run: |
          set -euo pipefail
          # Retry only native Godot crashes; syntax errors fail immediately.
          for attempt in 1 2; do
            rm -rf .godot
            set +e
            timeout 240s godot --headless --single-threaded-scene --path . --import \
              > "godot-import-${attempt}.log" 2>&1
            status=$?
            set -e
            cp "godot-import-${attempt}.log" godot-import.log
            # A native crash may also print Godot ERROR: thread warnings.
            # Retry exit 134/139 once, but NEVER retry GDScript parse errors.
            if grep -Eiq '(SCRIPT ERROR:|Parse Error:)' godot-import.log; then
              cat godot-import.log
              exit 1
            fi
            if [ "$status" -eq 0 ]; then
              if grep -Eiq '^ERROR:' godot-import.log; then
                cat godot-import.log
                exit 1
              fi
              echo "APEX_CI_IMPORT_PASS attempt=$attempt"
              break
            fi
            if [ "$attempt" -eq 2 ] || { [ "$status" -ne 134 ] && [ "$status" -ne 139 ]; }; then
              cat godot-import.log
              exit "$status"
            fi
            echo "Godot native import crash (${status}); retrying once"
          done

      - name: Run deterministic Core 2 smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          tests=(
            'apex_lab_track_smoke.gd|APEX_LAB_TRACK_PASS'
            'apex_lab_performance_probe.gd|APEX_LAB_PERF_PASS'
            'team_orders_066810_test.gd|TEAM_ORDERS_066810_PASS'
            'team_orders_066810_ui_test.gd|TEAM_ORDERS_066810_UI_PASS'
            'team_radio_06689_advice_test.gd|TEAM_RADIO_06689_PASS'
            'radio_0668101_booked_pit_advice_test.gd|RADIO_0668101_BOOKED_PIT_PASS'
            'team_radio_06689_ui_test.gd|TEAM_RADIO_UI_06689_PASS'
            'racecraft_06688_grip_defense_test.gd|RACECRAFT_06688_GRIP_PASS'
            'racecraft_0654_test.gd|RACECRAFT_PASS'
            'racecraft_broadphase_06691_test.gd|RACECRAFT_BROADPHASE_06691_PASS'
            'driver_dynamics_06687_tyre_judgement_test.gd|DRIVER_DYNAMICS_06687_PASS'
            'driver_dynamics_06687_ui_test.gd|DRIVER_DYNAMICS_06687_UI_PASS'
            'core2_06686_sort_contract.gd|CORE2_06686_SORT_CONTRACT_PASS'
            'driver_dynamics_0661_test.gd|DRIVER_DYNAMICS_0661_PASS'
            'race_launch_14_test.gd|RACE_LAUNCH_14_PASS'
            'race_start_066911_test.gd|RACE_START_066911_PASS'
            'overtaking_066912_test.gd|OVERTAKING_066912_PASS'
            'engineer_intelligence_066913_test.gd|ENGINEER_066913_PASS'
            'setup_track_066914_test.gd|SETUP_TRACK_066914_PASS'
            'weather_setup_15_test.gd|WEATHER_SETUP_15_PASS'
            'standings_refactor_test.gd|STANDINGS_REFACTOR_PASS'
            'hud_metric_refactor_test.gd|HUD_METRIC_REFACTOR_PASS'
            'hud_ranking_panel_refactor_test.gd|HUD_RANKING_PANEL_REFACTOR_PASS'
            'hud_pitwall_quick_panel_refactor_test.gd|HUD_PITWALL_QUICK_PANEL_REFACTOR_PASS'
            'hud_weather_panel_refactor_test.gd|HUD_WEATHER_PANEL_REFACTOR_PASS'
            'hud_minimap_panel_refactor_test.gd|HUD_MINIMAP_PANEL_REFACTOR_PASS'
            'racecraft_0662_test.gd|RACECRAFT_0662_UNIT_PASS'
            'pit_incidents_double_stack_test.gd|APEX INCIDENT DOUBLE STACK OK'
            'replay_0660_test.gd|REPLAY_UNIT_PASS'
            'hash_cache_06692_test.gd|APEX_HASH_CACHE_06692_PASS'
            'car_model_smoke_test.gd|APEX CAR MODEL TEST OK'
          )
          # FAST is the only automatic tier, including pushes to main.
          # Manual workflow_dispatch(tier=full) runs the legacy Core 2 suite.
          if [[ "$APEX_CI_TIER" == "fast" ]]; then
            if [[ ! "$APEX_BASE_SHA" =~ ^[0-9a-fA-F]{40}$ || "$APEX_BASE_SHA" =~ ^0{40}$ ]]; then
              APEX_BASE_SHA="$(git rev-parse "$APEX_HEAD_SHA^")"
            fi
            python3 tools/apex_ci_tiers.py \
              --base-sha "$APEX_BASE_SHA" --head-sha "$APEX_HEAD_SHA" \
              --project . > ci-results/fast-plan.tsv
            mapfile -t tests < ci-results/fast-plan.tsv
          fi
          echo "APEX_CI_TIER=$APEX_CI_TIER tests=${#tests[@]}"
          printf '%s\n' "${tests[@]}" > ci-results/test-plan.txt
          for entry in "${tests[@]}"; do
            script="${entry%%|*}"
            marker="${entry#*|}"
            log="ci-results/${script%.gd}.log"
            echo "::group::${script}"
            timeout 240s godot --headless --single-threaded-scene --path . --script "res://tests/${script}" 2>&1 | tee "${log}"
            if ! grep -Fq "${marker}" "${log}"; then
              echo "::error::Missing success marker ${marker} from ${script}"
              exit 1
            fi
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' "${log}"; then
              echo "::error::Godot reported an error in ${script}"
              exit 1
            fi
            echo "::endgroup::"
          done

      - name: Publish Test Lab CPU and memory profile
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/apex_lab_perf_report.py \
            --log ci-results/apex_lab_performance_probe.log \
            --output ci-results/lab-perf
          cat ci-results/lab-perf/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Publish logs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-core2-ci-logs
          path: |
            godot-import.log
            ci-results/*.log
            ci-results/fast-plan.tsv
            ci-results/test-plan.txt
            ci-results/lab-perf/
          if-no-files-found: warn
          retention-days: 7
