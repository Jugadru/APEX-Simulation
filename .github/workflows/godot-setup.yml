name: APEX Core 2 - Godot 4.7.2 CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apex-core2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core2-smoke:
    name: Import and Core 2 regression tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout Godot project
        uses: actions/checkout@v4

      - name: Install Godot 4.7.2
        uses: lihop/godot-setup@v3.0.1
        with:
          version: 4.7.2-stable

      - name: Verify Godot executable and project
        shell: bash
        run: |
          set -euo pipefail
          test -f project.godot
          test -f scripts/race_engine.gd
          godot --version

      - name: Import project (real editor check)
        shell: bash
        run: |
          set -euo pipefail
          timeout 240s godot --headless --single-threaded-scene --path . --import 2>&1 | tee godot-import.log
          if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' godot-import.log; then
            echo 'Godot reported import/parse errors'
            exit 1
          fi

      - name: Run deterministic Core 2 smoke tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          tests=(
            'driver_identity_066811_catalog_test.gd|DRIVER_IDENTITY_066811_PASS'
            'driver_identity_066811_ui_test.gd|DRIVER_IDENTITY_066811_UI_PASS'
            'team_orders_066810_test.gd|TEAM_ORDERS_066810_PASS'
            'team_orders_066810_ui_test.gd|TEAM_ORDERS_066810_UI_PASS'
            'team_radio_06689_advice_test.gd|TEAM_RADIO_06689_PASS'
            'team_radio_06689_ui_test.gd|TEAM_RADIO_UI_06689_PASS'
            'racecraft_06688_grip_defense_test.gd|RACECRAFT_06688_GRIP_PASS'
            'driver_dynamics_06687_tyre_judgement_test.gd|DRIVER_DYNAMICS_06687_PASS'
            'driver_dynamics_06687_ui_test.gd|DRIVER_DYNAMICS_06687_UI_PASS'
            'core2_06686_sort_contract.gd|CORE2_06686_SORT_CONTRACT_PASS'
            'driver_dynamics_0661_test.gd|DRIVER_DYNAMICS_0661_PASS'
            'racecraft_0662_test.gd|RACECRAFT_0662_UNIT_PASS'
            'pit_incidents_double_stack_test.gd|APEX INCIDENT DOUBLE STACK OK'
            'replay_0660_test.gd|REPLAY_UNIT_PASS'
            'car_model_smoke_test.gd|APEX CAR MODEL TEST OK'
          )
          for entry in "${tests[@]}"; do
            script="${entry%%|*}"
            marker="${entry#*|}"
            log="ci-results/${script%.gd}.log"
            echo "::group::${script}"
            timeout 240s godot --headless --single-threaded-scene --path . --script "res://tests/${script}" 2>&1 | tee "${log}"
            if ! grep -Fq "${marker}" "${log}"; then
              echo "::error::Missing success marker ${marker} from ${script}"
              exit 1
            fi
            if grep -Eiq '(^ERROR:|SCRIPT ERROR:|Parse Error:)' "${log}"; then
              echo "::error::Godot reported an error in ${script}"
              exit 1
            fi
            echo "::endgroup::"
          done


      - name: Probe two real licensed Commons driver portraits (optional network QA)
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          timeout 120s godot --headless --single-threaded-scene --path . --script res://tests/driver_identity_066811_network_probe.gd 2>&1 | tee portrait-network.log

      - name: Save optional Wikimedia probe log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-driver-portraits-live-probe
          path: portrait-network.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Package installable Core 2 source ZIP (photos downloaded opt-in inside game)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          python3 - <<'PY'
          import hashlib
          import os
          import pathlib
          import subprocess
          import zipfile

          root = pathlib.Path.cwd()
          name = "APEX_MOTORSPORT_MANAGER_v0.6.6.8.11_CORE2_DRIVER_IDENTITY_FONTE.zip"
          prefix = "APEX_MOTORSPORT_MANAGER_v0.6.6.8.11_CORE2_DRIVER_IDENTITY"
          destination = root / "dist" / name
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          count = 0
          with zipfile.ZipFile(destination, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6) as out:
              for raw in tracked:
                  if not raw:
                      continue
                  rel = os.fsdecode(raw).replace("\\", "/")
                  p = pathlib.PurePosixPath(rel)
                  if not p.parts or any(k in p.parts for k in (".git", ".godot", "__pycache__")):
                      continue
                  if rel.lower().endswith((".zip", ".mp4", ".log", ".apexreplay")) or ".zip.part" in rel.lower():
                      continue
                  path = root / rel
                  if not path.is_file():
                      continue
                  if rel.startswith("qa/"):
                      if path.suffix.lower() not in (".gd", ".uid", ".tscn", ".tres", ".json", ".md", ".txt", ".cfg") or path.stat().st_size > 262144:
                          continue
                  if path.stat().st_size > 25000000:
                      continue
                  out.write(path, f"{prefix}/{rel}")
                  count += 1
          with zipfile.ZipFile(destination) as check:
              bad = check.testzip()
              if bad:
                  raise RuntimeError(f"ZIP CRC invalid: {bad}")
              assert any(x.endswith("/project.godot") for x in check.namelist())
              assert any(x.endswith("/data/driver_identity_2012.json") for x in check.namelist())
          digest = hashlib.sha256(destination.read_bytes()).hexdigest()
          (root / "dist" / "SHA256.txt").write_text(f"{digest}  {name}\n")
          print(f"PACKAGED {count} tracked files: {destination.stat().st_size} bytes | SHA256={digest}")
          PY

      - name: Publish installable version 0.6.6.8.11
        uses: actions/upload-artifact@v4
        with:
          name: APEX-v0.6.6.8.11-Core2-Driver-Identity
          path: |
            dist/*.zip
            dist/SHA256.txt
          if-no-files-found: error
          retention-days: 7

      - name: Publish logs for diagnosis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-core2-ci-logs
          path: |
            godot-import.log
            ci-results/*.log
          if-no-files-found: warn
          retention-days: 7
